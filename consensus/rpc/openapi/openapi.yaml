  /lag_status:
    get:
      summary: Lag Status
      operationId: lag_status
      tags:
        - Info
      description: |
        Get Tendermint lag status including latest height, current max peer height, and lag height.
      responses:
        '200':
          description: Lag Status of the node and is not lagging; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/LagStatusResponse'
