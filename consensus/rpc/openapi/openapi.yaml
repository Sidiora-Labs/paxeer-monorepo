          - last_validators
          - triggered_timeout_precommit
          properties:
            height:
              type: string
              example: '1311801'
            round:
              type: integer
              example: 0
            step:
              type: integer
              example: 3
            start_time:
              type: string
              example: '2019-08-05T11:28:49.064658805Z'
            commit_time:
              type: string
              example: '2019-08-05T11:28:44.064658805Z'
