              type: string
              example: '2019-08-01T11:52:38.962730289Z'
            proposal_block_hash:
              type: string
              example: 634ADAF1F402663BEC2ABC340ECE8B4B45AA906FA603272ACC5F5EED3097E009
            locked_block_hash:
              type: string
              example: 634ADAF1F402663BEC2ABC340ECE8B4B45AA906FA603272ACC5F5EED3097E009
            valid_block_hash:
              type: string
              example: 634ADAF1F402663BEC2ABC340ECE8B4B45AA906FA603272ACC5F5EED3097E009
            height_vote_set:
