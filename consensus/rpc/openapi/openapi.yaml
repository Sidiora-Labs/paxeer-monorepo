openapi: 3.0.0
info:
  title: Paxeer consensus diagnostic RPC
  contact:
    name: Tendermint RPC
    url: https://github.com/tendermint/tendermint/issues/new/choose
  description: |
    This is the internal consensus diagnostic interface, separate from the
    public Paxeer node JSON-RPC on EVM chain 125 (0x7d). The public HTTPS and
    WebSocket endpoint is the root of https://api-mainnet-beta.paxeer.network.
    See the maintained [public root endpoint and namespace contract](../../../docs/site/docs/reference/public-rpc.md#method-contracts).
    Public node namespaces are debug, echo, eth, net, pax, test and txpool,
    subject to node configuration; hosted px_ methods belong to the separate
    [gateway OpenRPC contract](../../../services/platform/hosted/gateway/openrpc.json).
    This diagnostic schema does not describe eth_ or px_ methods.

    The maintained [consensus contract](../../internal/rpc/core/consensus_contract.md)
    covers names, encodings, Autobahn refusals and state recovery.

    The diagnostic RPC supports the following protocols:

    * URI over HTTP
    * JSON-RPC 2.0 over HTTP
    * JSON-RPC 2.0 over websockets (deprecated)

    ## Configuration

    RPC can be configured by tuning parameters under `[rpc]` table in the
    `$TMHOME/config/config.toml` file or by using the `--rpc.X` command-line
    flags.

    Default rpc listen address is `tcp://127.0.0.1:26657`.
    To set another address, set the `laddr` config parameter to desired value.
    CORS allowed origins are empty by default. CORS can be enabled by setting
    `cors_allowed_origins`, `cors_allowed_methods`, `cors_allowed_headers`
    config parameters.

    ## Arguments

    Arguments which expect strings or byte arrays may be passed as quoted
    strings, like `"abc"` or as `0x`-prefixed strings, like `0x616263`.

    ## URI/HTTP

    A GET request with arguments encoded as query parameters:

        curl localhost:26657/block?height=5

    ## JSONRPC/HTTP

    JSONRPC requests can be POST'd to the root RPC endpoint via HTTP.

        curl --header "Content-Type: application/json" --request POST --data '{"method": "block", "params": ["5"], "id": 1}' localhost:26657

    ## JSONRPC/websockets

    In Tendermint v0.35 and earlier, JSONRPC requests can be also made via
    websocket.  The websocket interface is deprecated in Tendermint v0.36, and
    will be removed in v0.37.

    The websocket endpoint is at `/websocket`, e.g. `localhost:26657/websocket`.
    The RPC methods for event subscription (`subscribe`, `unsubscribe`, and
    `unsubscribe_all`) are only available via websockets.

    Example using https://github.com/hashrocket/ws:

        ws ws://localhost:26657/websocket
        > { "jsonrpc": "2.0", "method": "subscribe", "params": ["tm.event='NewBlock'"], "id": 1 }
  version: "Master"
  license:
    name: Apache 2.0
    url: https://github.com/tendermint/tendermint/blob/master/LICENSE
externalDocs:
  description: Maintained consensus diagnostic contract, refusals and recovery
  url: ../../internal/rpc/core/consensus_contract.md
servers:
  - url: http://127.0.0.1:26657
    description: Internal consensus diagnostics at the default loopback listener
tags:
  - name: Websocket
    description: Subscribe/unsubscribe are reserved for websocket events.
  - name: Info
    description: Informations about the node APIs
  - name: Tx
    description: Transactions broadcast APIs
  - name: ABCI
    description: ABCI APIs
  - name: Events
    description: Event subscription APIs
  - name: Evidence
    description: Evidence APIs
  - name: Unsafe
    description: Unsafe APIs
paths:
  /:
    post:
      summary: Call registered RPC methods with JSON-RPC envelopes
      operationId: jsonrpc
      description: |
        One request or a batch of up to 10. Notifications are ignored. A response
        to a single request is an object; a response to a batch is an array,
        including a one-item batch. Method results use the corresponding URI
        success schema. Autobahn refusals for commit, consensus_state,
        dump_consensus_state and broadcast_evidence return HTTP 200 with a
        JSON-RPC error envelope, no result, and the request id. See each
        operation for its sentinel and diagnostic data; Go error identity is
        not serialized.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/JSONRPCRequest'
              - type: array
                items:
                  $ref: '#/components/schemas/JSONRPCRequest'
                maxItems: 10
      responses:
        '200':
          description: JSON-RPC success or structured refusal. Notifications have an empty body.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JSONRPCResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/JSONRPCResponse'
        '417':
          description: At least one response reports excessive lag.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JSONRPCFailure'
                - type: array
                  items:
                    $ref: '#/components/schemas/JSONRPCResponse'
  /broadcast_tx_sync:
    get:
      summary: Returns with the response from CheckTx. Does not wait for DeliverTx result.
      deprecated: true
      tags:
        - Tx
      operationId: broadcast_tx_sync
      description: |
        This method is deprecated in Tendermint v0.36, and will be
        removed in v0.37. Use `broadcast_tx`, which has similar
        semantics.

        This method blocks until CheckTx returns and reports its result, but
        does not wait for the transaction to be included in a block. To know
        when the transaction is included in a block, check for the transaction
        event using JSON-RPC.  See
        https://docs.tendermint.com/master/app-dev/subscribing-to-events-via-websocket.html

        See https://docs.tendermint.com/master/tendermint-core/using-tendermint.html#formatting
        for formatting/encoding rules.
      parameters:
        - in: query
          name: tx
          required: true
          schema:
            type: string
          example: "456"
          description: The transaction
      responses:
        '200':
          description: Empty; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BroadcastTxResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
  /broadcast_tx:
    get:
      summary: Returns with the response from CheckTx. Does not wait for DeliverTx result.
      tags:
        - Tx
      operationId: broadcast_tx
      description: |
        This method blocks until CheckTx returns and reports its result, but
        does not wait for the transaction to be included in a block. To know
        when the transaction is included in a block, check for the transaction
        event using JSON-RPC.  See
        https://docs.tendermint.com/master/app-dev/subscribing-to-events-via-websocket.html

        See https://docs.tendermint.com/master/tendermint-core/using-tendermint.html#formatting
        for formatting/encoding rules.
      parameters:
        - in: query
          name: tx
          required: true
          schema:
            type: string
          example: "456"
          description: The transaction
      responses:
        '200':
          description: Empty; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BroadcastTxResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
  /broadcast_tx_async:
    get:
      summary: Returns right away, with no response. Does not wait for CheckTx nor DeliverTx results.
      deprecated: true
      tags:
        - Tx
      operationId: broadcast_tx_async
      description: |
        This method is deprecated in Tendermint v0.36, and will be
        removed in v0.37. Use `broadcast_tx`.

        This method submits the transaction and returns immediately without
        waiting for the transaction to be checked (CheckTx) or committed.  Too
        know when the transaction is included in a block, you can check for the
        transaction event using JSON-RPC.  See
        https://docs.tendermint.com/master/app-dev/subscribing-to-events-via-websocket.html

        See https://docs.tendermint.com/master/tendermint-core/using-tendermint.html#formatting
        for formatting/encoding rules.
      parameters:
        - in: query
          name: tx
          required: true
          schema:
            type: string
            example: "123"
          description: The transaction
      responses:
        '200':
          description: empty answer; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BroadcastTxResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
  /broadcast_tx_commit:
    get:
      summary: Returns with the responses from CheckTx and DeliverTx.
      deprecated: true
      tags:
        - Tx
      operationId: broadcast_tx_commit
      description: |
        This method waits for the transaction to be checked (CheckTx) and makes
        a best effort to wait for it to be committed into a block before
        returning.  It will report an error if the request times out before the
        transaction commits.  If CheckTx or DeliverTx fails, the RPC will
        succeed and report the failing (non-zero) ABCI result code.

        WARNING: Use this only for testing and development. For production use,
        call broadcast_tx.

        To know when a transaction is included in a block, check for the
        transaction event using JSON-RPC.  See
        https://docs.tendermint.com/master/app-dev/subscribing-to-events-via-websocket.html

        See https://docs.tendermint.com/master/tendermint-core/using-tendermint.html#formatting
        for formatting/encoding rules.
      parameters:
        - in: query
          name: tx
          required: true
          schema:
            type: string
            example: "785"
          description: The transaction
      responses:
        '200':
          description: empty answer; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/BroadcastTxCommitResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
  /check_tx:
