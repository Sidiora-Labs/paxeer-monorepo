                    example:
                    - Vote{0:000001E443FD 1262197/00/1(Prevote) 634ADAF1F402 7BB974E1BA40 @ 2019-08-01T11:52:35.513572509Z}
                    - nil-Vote
                  prevotes_bit_array:
                    type: string
                    example: BA{100:xxxxxxxxxxxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx} 169753436/170151262 = 1.00
                  precommits:
                    type: array
                    items:
                      type: string
                    example:
                    - Vote{5:18C78D135C9D 1262197/00/2(Precommit) 634ADAF1F402 8B5EFFFEABCD @ 2019-08-01T11:52:36.25600005Z}
                    - nil-Vote
                  precommits_bit_array:
                    type: string
                    example: BA{100:xxxxxx_xxxxx_xxxx_x_xxx_xx_xx_xx__x_x_x__xxxxxxxxxxxxxx_xxxx_xx_xxxxxx_xxxxxxxx_xxxx_xxx_x_xxxx__xxx} 118726247/170151262 = 0.70
            proposer:
              type: object
              properties:
                address:
                  type: string
                  example: D540AB022088612AC74B287D076DBFBC4A377A2E
                index:
                  type: integer
                  example: 0
          type: object
      type: object

    ConsensusParamsResponse:
      type: object
      required:
      - block_height
      - consensus_params
      properties:
        block_height:
          type: string
          example: '1'
        consensus_params:
          $ref: '#/components/schemas/ConsensusParams'

    NumUnconfirmedTransactionsResponse:
      required:
      - n_txs
      - total
      - total_bytes
      properties:
        n_txs:
          type: string
          example: '31'
        total:
          type: string
          example: '82'
        total_bytes:
          type: string
          example: '19974'
      type: object

    UnconfirmedTransactionsResponse:
      required:
      - n_txs
      - total
      - total_bytes
      - txs
      properties:
        n_txs:
          type: string
          example: '82'
        total:
          type: string
          example: '82'
        total_bytes:
          type: string
          example: '19974'
        txs:
          type: array
          nullable: true
          items:
            type: string
            nullable: true
          example:
          - 
      type: object

    TxSearchResponse:
      type: object
      properties:
        txs:
          type: array
          items:
            $ref: '#/components/schemas/TxResponse'
          nullable: true
        total_count:
          $ref: '#/components/schemas/Int64'
      required:
      - txs
      - total_count
      additionalProperties: false

    TxResponse:
      type: object
      properties:
        hash:
          $ref: '#/components/schemas/HexBytes'
        height:
          $ref: '#/components/schemas/Int64'
        index:
          type: integer
          minimum: 0
          maximum: 4294967295
        tx_result:
          $ref: '#/components/schemas/ExecTxResult'
        tx:
          $ref: '#/components/schemas/Base64'
        proof:
          $ref: '#/components/schemas/TxProof'
      required:
      - hash
      - height
      - index
      - tx_result
      - tx
      additionalProperties: false

    ABCIInfoResponse:
      required:
      - response
      properties:
        response:
          required:
          - data
          - app_version
          - version
          properties:
            data:
              type: string
              example: '{"size":0}'
            version:
              type: string
              example: 0.16.1
            app_version:
              type: string
              example: '1314126'
          type: object
      type: object

    ABCIQueryResponse:
      type: object
      properties:
        response:
          $ref: '#/components/schemas/ResponseQuery'
      required:
      - response
      additionalProperties: false

    BroadcastEvidenceResponse:
      type: string
      example: ''

    BroadcastTxCommitResponse:
      type: object
      properties:
        check_tx:
          $ref: '#/components/schemas/ResponseCheckTx'
        tx_result:
          $ref: '#/components/schemas/ExecTxResult'
        hash:
          $ref: '#/components/schemas/HexBytes'
        height:
          $ref: '#/components/schemas/Int64'
      required:
      - check_tx
      - tx_result
      - hash
      - height
      additionalProperties: false

    CheckTxResponse:
      $ref: '#/components/schemas/ResponseCheckTx'

    BroadcastTxResponse:
      required:
      - code
      - data
      - log
      - hash
      properties:
        code:
          type: string
          example: '0'
        data:
          type: string
          example: ''
        log:
          type: string
          example: ''
        codespace:
          type: string
          example: ibc
        hash:
          type: string
          example: 0D33F2F03A5234F38706E43004489E061AC40A2E
      type: object

    dialResp:
      type: object
      properties:
        Log:
          type: string
          example: "Dialing seeds in progress. See /net_info for details"

    BlockSearchResponse:
      type: object
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/BlockComplete'
          nullable: true
        total_count:
          $ref: '#/components/schemas/Int64'
      required:
      - blocks
      - total_count
      additionalProperties: false

    ValidatorPriority:
      type: object
      properties:
        address:
          type: string
          example: "000001E443FD237E4B616E2FA69DF4EE3D49A94F"
        pub_key:
          required:
            - "type"
            - "value"
          properties:
            type:
              type: string
              example: "tendermint/PubKeyEd25519"
            value:
              type: string
              example: "9tK9IT+FPdf2qm+5c2qaxi10sWP+3erWTKgftn2PaQM="
          type: object
        voting_power:
          type: string
          example: "239727"
        proposer_priority:
          type: string
          example: "-11896414"

    # Stripped down validator
    Validator:
      type: object
      properties:
        pub_key:
          $ref: "#/components/schemas/PubKey"
        voting_power:
          type: integer
        address:
          type: string

    # Consensus Params
    ConsensusParams:
      type: object
      properties:
        block:
          type: object
          properties:
            max_bytes:
              $ref: '#/components/schemas/Int64'
            max_gas:
              $ref: '#/components/schemas/Int64'
            min_txs_in_block:
              $ref: '#/components/schemas/Int64'
            max_gas_wanted:
              $ref: '#/components/schemas/Int64'
          required:
          - max_bytes
          - max_gas
          - min_txs_in_block
          - max_gas_wanted
          additionalProperties: false
        evidence:
          type: object
          properties:
            max_age_num_blocks:
              $ref: '#/components/schemas/Int64'
            max_age_duration:
              $ref: '#/components/schemas/Int64'
            max_bytes:
              $ref: '#/components/schemas/Int64'
          required:
          - max_age_num_blocks
          - max_age_duration
          - max_bytes
          additionalProperties: false
        validator:
          type: object
          properties:
            pub_key_types:
              type: array
              items:
                type: string
          required:
          - pub_key_types
          additionalProperties: false
        version:
          type: object
          properties:
            app_version:
              $ref: '#/components/schemas/UInt64'
          required:
          - app_version
          additionalProperties: false
        synchrony:
          type: object
          properties:
            precision:
              $ref: '#/components/schemas/Int64'
            message_delay:
              $ref: '#/components/schemas/Int64'
          required:
          - precision
          - message_delay
          additionalProperties: false
        timeout:
          type: object
          properties:
            propose:
              $ref: '#/components/schemas/Int64'
            propose_delta:
              $ref: '#/components/schemas/Int64'
            vote:
              $ref: '#/components/schemas/Int64'
            vote_delta:
              $ref: '#/components/schemas/Int64'
            commit:
              $ref: '#/components/schemas/Int64'
            bypass_commit_timeout:
              type: boolean
          required:
          - propose
          - propose_delta
          - vote
          - vote_delta
          - commit
          - bypass_commit_timeout
          additionalProperties: false
        abci:
          type: object
          properties:
            vote_extensions_enable_height:
              $ref: '#/components/schemas/Int64'
            recheck_tx:
              type: boolean
          required:
          - vote_extensions_enable_height
          - recheck_tx
          additionalProperties: false
      required:
      - block
      - evidence
      - validator
      - version
      - synchrony
      - timeout
      - abci
      additionalProperties: false
      description: Current consensus parameters. Durations are decimal nanoseconds; heights and limits are decimal integers.

    Event:
      type: object
      properties:
        key:
          $ref: '#/components/schemas/Base64'
        value:
          $ref: '#/components/schemas/Base64'
        index:
          type: boolean
      required:
      - key
      - value
      - index
      additionalProperties: false

    BlockHeader:
      required:
      - version
      - chain_id
      - height
      - time
      - last_block_id
      - last_commit_hash
      - data_hash
      - validators_hash
      - next_validators_hash
      - consensus_hash
      - app_hash
      - last_results_hash
      - evidence_hash
      - proposer_address
      properties:
        version:
          properties:
            block:
              type: string
              example: '10'
            app:
              type: string
              example: '0'
          type: object
        chain_id:
          type: string
          example: cosmoshub-2
        height:
          type: string
          example: '12'
        time:
          type: string
          example: '2019-04-22T17:01:51.701356223Z'
        last_block_id:
          $ref: '#/components/schemas/BlockID'
        last_commit_hash:
          type: string
          example: 21B9BC845AD2CB2C4193CDD17BFC506F1EBE5A7402E84AD96E64171287A34812
        data_hash:
          type: string
          example: 970886F99E77ED0D60DA8FCE0447C2676E59F2F77302B0C4AA10E1D02F18EF73
        validators_hash:
          type: string
          example: D658BFD100CA8025CFD3BECFE86194322731D387286FBD26E059115FD5F2BCA0
        next_validators_hash:
          type: string
          example: D658BFD100CA8025CFD3BECFE86194322731D387286FBD26E059115FD5F2BCA0
        consensus_hash:
          type: string
          example: 0F2908883A105C793B74495EB7D6DF2EEA479ED7FC9349206A65CB0F9987A0B8
        app_hash:
          type: string
          example: 223BF64D4A01074DC523A80E76B9BBC786C791FB0A1893AC5B14866356FCFD6C
        last_results_hash:
          type: string
          example: ''
        evidence_hash:
          type: string
          example: ''
        proposer_address:
          type: string
          example: D540AB022088612AC74B287D076DBFBC4A377A2E
      type: object

    BlockID:
      required:
        - "hash"
        - "parts"
      properties:
        hash:
          type: string
          example: "112BC173FD838FB68EB43476816CD7B4C6661B6884A9E357B417EE957E1CF8F7"
        parts:
          required:
            - "total"
            - "hash"
          properties:
            total:
              type: integer
              example: 1
            hash:
              type: string
              example: "38D4B26B5B725C4F13571EFE022C030390E4C33C8CF6F88EDD142EA769642DBD"
          type: object

    Int64:
      type: string
      pattern: ^-?[0-9]+$
      description: Signed 64-bit integer encoded as a decimal string.

    UInt64:
      type: string
      pattern: ^[0-9]+$
      description: Unsigned 64-bit integer encoded as a decimal string.

    Base64:
      type: string
      format: byte
      description: Standard base64-encoded bytes.

    NullableBase64:
      oneOf:
      - $ref: '#/components/schemas/Base64'
      - type: string
        nullable: true
        enum:
        - null
      description: Base64 bytes, or null when the producer's byte slice is nil.

    HexBytes:
      type: string
      pattern: ^[0-9A-Fa-f]*$
      description: Hexadecimal bytes without a 0x prefix.

    RPCError:
      type: object
      properties:
        code:
          type: integer
        message:
          type: string
        data:
          type: string
          description: Optional diagnostic string.
      required:
      - code
      - message
      additionalProperties: false

    ResultHeader:
      type: object
      properties:
        header:
          oneOf:
          - $ref: '#/components/schemas/BlockHeader'
          - type: object
            nullable: true
            enum:
            - null
          description: Null when the requested hash is absent.
      required:
      - header
      additionalProperties: false

    ABCIEvent:
      type: object
      properties:
        type:
          type: string
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/Event'
      additionalProperties: false

    ExecTxResult:
      type: object
      properties:
        code:
          type: integer
          minimum: 0
          maximum: 4294967295
        data:
          $ref: '#/components/schemas/Base64'
        log:
          type: string
        info:
          type: string
        gas_wanted:
          $ref: '#/components/schemas/Int64'
        gas_used:
          $ref: '#/components/schemas/Int64'
        events:
          type: array
          items:
            $ref: '#/components/schemas/ABCIEvent'
        codespace:
          type: string
        evm_tx_info:
          $ref: '#/components/schemas/EvmTxInfo'
      additionalProperties: false

    EvmTxInfo:
      type: object
      properties:
        senderAddress:
          type: string
        nonce:
          $ref: '#/components/schemas/UInt64'
        txHash:
          type: string
        vmError:
          type: string
      additionalProperties: false

    ResponseCheckTx:
      type: object
      properties:
        code:
          type: integer
          minimum: 0
          maximum: 4294967295
        data:
          $ref: '#/components/schemas/NullableBase64'
        log:
          type: string
        gasWanted:
          $ref: '#/components/schemas/Int64'
        codespace:
          type: string
        priority:
          $ref: '#/components/schemas/Int64'
        gasEstimated:
          $ref: '#/components/schemas/Int64'
      required:
      - code
      - data
      - log
      - gasWanted
      - codespace
      - priority
      - gasEstimated
      additionalProperties: false

    ProofOp:
      type: object
      properties:
        type:
          type: string
        key:
          $ref: '#/components/schemas/Base64'
        data:
          $ref: '#/components/schemas/Base64'
      required:
      - type
      - key
      - data
      additionalProperties: false

    ProofOps:
      type: object
      properties:
        ops:
          type: array
          items:
            $ref: '#/components/schemas/ProofOp'
      required:
      - ops
      additionalProperties: false

    ResponseQuery:
      type: object
      properties:
        code:
          type: integer
          minimum: 0
          maximum: 4294967295
        log:
          type: string
        info:
          type: string
        index:
          $ref: '#/components/schemas/Int64'
        key:
          $ref: '#/components/schemas/NullableBase64'
        value:
          $ref: '#/components/schemas/NullableBase64'
        proofOps:
          oneOf:
          - $ref: '#/components/schemas/ProofOps'
          - type: object
            nullable: true
            enum:
            - null
          description: The jsonpb wire name of ResponseQuery.proof_ops.
        height:
          $ref: '#/components/schemas/Int64'
        codespace:
          type: string
      required:
      - code
      - log
      - info
      - index
      - key
      - value
      - proofOps
      - height
      - codespace
      additionalProperties: false

    MerkleProof:
      type: object
      properties:
        total:
          $ref: '#/components/schemas/Int64'
        index:
          $ref: '#/components/schemas/Int64'
        leaf_hash:
          $ref: '#/components/schemas/Base64'
        aunts:
          type: array
          items:
            $ref: '#/components/schemas/Base64'
          nullable: true
      required:
      - total
      - index
      - leaf_hash
      - aunts
      additionalProperties: false

    TxProof:
      type: object
      properties:
        root_hash:
          $ref: '#/components/schemas/HexBytes'
        data:
          $ref: '#/components/schemas/Base64'
        proof:
          $ref: '#/components/schemas/MerkleProof'
      required:
      - root_hash
      - data
      - proof
      additionalProperties: false

    ValidatorUpdate:
      type: object
      properties:
        pub_key:
          $ref: '#/components/schemas/PubKey'
        power:
          $ref: '#/components/schemas/Int64'
      required:
      - power
      additionalProperties: false

    ConsensusParamUpdates:
      type: object
      properties:
        block:
          type: object
          properties:
            max_bytes:
              $ref: '#/components/schemas/Int64'
            max_gas:
              $ref: '#/components/schemas/Int64'
            min_txs_in_block:
              $ref: '#/components/schemas/Int64'
            max_gas_wanted:
              $ref: '#/components/schemas/Int64'
          additionalProperties: false
        evidence:
          type: object
          properties:
            max_age_num_blocks:
              $ref: '#/components/schemas/Int64'
            max_age_duration:
              $ref: '#/components/schemas/Int64'
            max_bytes:
              $ref: '#/components/schemas/Int64'
          additionalProperties: false
        validator:
          type: object
          properties:
            pub_key_types:
              type: array
              items:
                type: string
          additionalProperties: false
        version:
          type: object
          properties:
            app_version:
              $ref: '#/components/schemas/UInt64'
          additionalProperties: false
        synchrony:
          type: object
          properties:
            precision:
              $ref: '#/components/schemas/Int64'
            message_delay:
              $ref: '#/components/schemas/Int64'
          additionalProperties: false
        timeout:
          type: object
          properties:
            propose:
              $ref: '#/components/schemas/Int64'
            propose_delta:
              $ref: '#/components/schemas/Int64'
            vote:
              $ref: '#/components/schemas/Int64'
            vote_delta:
              $ref: '#/components/schemas/Int64'
            commit:
              $ref: '#/components/schemas/Int64'
            bypass_commit_timeout:
              type: boolean
          additionalProperties: false
        abci:
          type: object
          properties:
            vote_extensions_enable_height:
              $ref: '#/components/schemas/Int64'
            recheck_tx:
              type: boolean
          additionalProperties: false
      additionalProperties: false
      description: Sparse parameter updates from FinalizeBlock; absent sections are unchanged. Durations are decimal nanoseconds.

    JSONRPCSuccess:
      allOf:
      - $ref: '#/components/schemas/JSONRPC'
      - type: object
        properties:
          result:
            anyOf:
            - $ref: '#/components/schemas/BroadcastTxResponse'
            - $ref: '#/components/schemas/BroadcastTxCommitResponse'
            - $ref: '#/components/schemas/CheckTxResponse'
            - $ref: '#/components/schemas/EventsResponse'
            - $ref: '#/components/schemas/EmptyResponse'
            - $ref: '#/components/schemas/StatusResponse'
            - $ref: '#/components/schemas/LagStatusResponse'
            - $ref: '#/components/schemas/NetInfoResponse'
            - $ref: '#/components/schemas/BlockchainResponse'
            - $ref: '#/components/schemas/HeaderResponse'
            - $ref: '#/components/schemas/BlockResponse'
            - $ref: '#/components/schemas/BlockResultsResponse'
            - $ref: '#/components/schemas/CommitResponse'
            - $ref: '#/components/schemas/ValidatorsResponse'
            - $ref: '#/components/schemas/GenesisResponse'
            - $ref: '#/components/schemas/GenesisChunkedResponse'
            - $ref: '#/components/schemas/DumpConsensusResponse'
            - $ref: '#/components/schemas/ConsensusStateResponse'
            - $ref: '#/components/schemas/ConsensusParamsResponse'
            - $ref: '#/components/schemas/UnconfirmedTransactionsResponse'
            - $ref: '#/components/schemas/NumUnconfirmedTransactionsResponse'
            - $ref: '#/components/schemas/TxSearchResponse'
            - $ref: '#/components/schemas/BlockSearchResponse'
            - $ref: '#/components/schemas/TxResponse'
            - $ref: '#/components/schemas/ABCIInfoResponse'
            - $ref: '#/components/schemas/ABCIQueryResponse'
            - $ref: '#/components/schemas/BroadcastEvidenceResponse'
        required:
        - result
      not:
        required:
        - error

    JSONRPCFailure:
      allOf:
      - $ref: '#/components/schemas/JSONRPC'
      oneOf:
      - type: object
        properties:
          error:
            $ref: '#/components/schemas/RPCError'
        required:
        - error
        not:
          required:
          - result
      - type: object
        properties:
          error:
            allOf:
            - $ref: '#/components/schemas/RPCError'
            - type: object
              properties:
                code:
                  type: integer
                  enum:
                  - -32604
          result:
            $ref: '#/components/schemas/LagStatusResponse'
        required:
        - error
        - result
      description: Refusals omit result except lag errors, which retain the lag result as well as error.

    JSONRPCResponse:
      oneOf:
      - $ref: '#/components/schemas/JSONRPCSuccess'
      - $ref: '#/components/schemas/JSONRPCFailure'

    JSONRPCRequest:
      type: object
      properties:
        jsonrpc:
          type: string
          enum:
          - '2.0'
        id:
          oneOf:
          - type: integer
          - type: string
        method:
          type: string
        params:
          oneOf:
          - type: object
            additionalProperties: true
          - type: array
            items: {}
      required:
      - method
      additionalProperties: false
