      responses:
        '200':
          description: Response of the submitted query; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ABCIQueryResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
  /broadcast_evidence:
    get:
      summary: Broadcast evidence of the misbehavior.
      operationId: broadcast_evidence
      parameters:
        - in: query
          name: evidence
          description: JSON evidence
          required: true
          schema:
            type: string
            example: "JSON_EVIDENCE_encoded"
      tags:
        - Evidence
      description: |
        Autobahn refuses this route with ErrEvidenceNotAccepted, including
        otherwise valid CometBFT evidence; it does not forward evidence to
        Autobahn. Only a legacy environment with an evidence pool accepts
        validated CometBFT evidence. Parameter decoding precedes mode dispatch.

        After successful parameter decoding, the refusal is HTTP 200. URI GET
        returns a bare RPCError; root JSON-RPC POST returns an error envelope
        with the request id and no result. The numeric code is -32603,
        message is "Internal error", and data is "evidence is not accepted under autobahn consensus".
        In-process callers can use errors.Is with coretypes.ErrEvidenceNotAccepted;
        remote callers receive RPCError fields rather than Go sentinel identity.
      responses:
        '200':
          description: Autobahn returns ErrEvidenceNotAccepted; the success schema applies only to the configured legacy mode. URI responses are bare results or RPCError objects.
          content:
            application/json:
              examples:
                autobahn_refusal:
                  summary: Autobahn diagnostic refusal (URI GET)
                  value:
                    code: -32603
                    message: Internal error
                    data: evidence is not accepted under autobahn consensus
              schema:
                anyOf:
                - $ref: '#/components/schemas/BroadcastEvidenceResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
