                example: 357f6a6c1d27414579a8185060aa8adf9815c43c@68.183.41.207:26656
              peer_state:
                required:
                - round_state
                - stats
                properties:
                  round_state:
                    required:
                    - height
                    - round
                    - step
                    - start_time
                    - proposal
                    - proposal_block_parts_header
                    - proposal_block_parts
                    - proposal_pol_round
                    - proposal_pol
                    - prevotes
                    - precommits
                    - last_commit_round
                    - last_commit
                    - catchup_commit_round
                    - catchup_commit
                    properties:
                      height:
                        type: string
                        example: '1311801'
                      round:
                        type: string
                        example: '0'
                      step:
                        type: integer
                        example: 3
                      start_time:
                        type: string
                        example: '2019-08-05T11:28:49.21730864Z'
                      proposal:
                        type: boolean
                        example: false
                      proposal_block_parts_header:
                        required:
                        - total
                        - hash
                        properties:
                          total:
                            type: integer
                            example: 0
                          hash:
                            type: string
                            example: ''
                        type: object
                      proposal_pol_round:
                        nullable: true
                        type: integer
                        example: -1
                      proposal_pol:
                        nullable: true
                        type: string
                        example: ____________________________________________________________________________________________________
                      prevotes:
                        nullable: true
                        type: string
                        example: ___________________x________________________________________________________________________________
                      precommits:
                        nullable: true
                        type: string
                        example: ____________________________________________________________________________________________________
                      last_commit_round:
                        nullable: true
                        type: integer
                        example: 0
                      last_commit:
                        nullable: true
                        type: string
                        example: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
                      catchup_commit_round:
                        type: integer
                        nullable: true
                        example: -1
                      catchup_commit:
                        nullable: true
                        type: string
                        example: ____________________________________________________________________________________________________
                    type: object
                  stats:
                    required:
                    - votes
                    - block_parts
                    properties:
                      votes:
                        type: string
                        example: '1159558'
                      block_parts:
                        type: string
                        example: '4786'
                    type: object
                type: object
      type: object

    ConsensusStateResponse:
      required:
      - round_state
      properties:
        round_state:
          required:
          - height/round/step
          - start_time
          - proposal_block_hash
          - locked_block_hash
          - valid_block_hash
