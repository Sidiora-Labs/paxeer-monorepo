          description: ABCI application's CheckTx response; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CheckTxResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
