  /commit:
    get:
      summary: Get commit results at a specified height
      operationId: commit
      parameters:
        - in: query
          name: height
          description: height to return. If no height is provided, it will fetch commit information regarding the latest block.
          schema:
            type: integer
            default: 0
            example: 1
      tags:
        - Info
      description: |
        Autobahn refuses this route with ErrCommitNotAvailable, even when a
        height is omitted or invalid. Tendermint precommit proofs are not served.
        Use /block and /header for retained finalized block metadata and
        /block_results for persisted execution results; these are not signed
        Tendermint commitments or independently verifiable light-client proofs.
        No replacement commitment-proof route is exposed by this schema.

        Only a legacy environment with a populated CometBFT BlockStore can
        return a signed_header. For the latest height its seen commit has
        canonical=false; a stored commit from the following block has
        canonical=true. An unavailable legacy commit may return null.

        After successful parameter decoding, the refusal is HTTP 200. URI GET
        returns a bare RPCError; root JSON-RPC POST returns an error envelope
        with the request id and no result. The numeric code is -32603,
        message is "Internal error", and data is "commit is not available under autobahn consensus".
        In-process callers can use errors.Is with coretypes.ErrCommitNotAvailable;
        remote callers receive RPCError fields rather than Go sentinel identity.
      responses:
        '200':
          description: Autobahn returns ErrCommitNotAvailable; the success schema applies only to the configured legacy mode. URI responses are bare results or RPCError objects.
          content:
            application/json:
              examples:
                autobahn_refusal:
                  summary: Autobahn diagnostic refusal (URI GET)
                  value:
                    code: -32603
                    message: Internal error
                    data: commit is not available under autobahn consensus
              schema:
                anyOf:
                - $ref: '#/components/schemas/CommitResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
          description: HTTP transport failed to encode a response or recovered a panic.
          content:
            text/plain:
              schema:
                type: string
        '400':
          description: URI query parsing failed before RPC dispatch.
          content:
            text/plain:
              schema:
                type: string
