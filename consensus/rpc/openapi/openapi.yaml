  /status:
    get:
      summary: Node Status
      operationId: status
      tags:
        - Info
      description: |
        Get Tendermint status including node info, pubkey, latest block hash, app hash, block height, current max peer height, and time.
      responses:
        '200':
          description: Status of the node; URI returns the bare result or a structured RPCError.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/StatusResponse'
                - $ref: '#/components/schemas/RPCError'
        '500':
