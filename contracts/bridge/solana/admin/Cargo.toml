[package]
name = "paxeer-x-bridge-solana-admin"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[[bin]]
name = "paxeer-x-bridge-solana-admin"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
bincode = "1.3"
paxeer-x-bridge-solana-program = { path = ".." }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-account-decoder-client-types = "=3.1.12"
solana-commitment-config = "=3.0.0"
solana-loader-v3-interface = { version = "=6.1.0", features = ["serde"] }
solana-program = "=3.0.0"
solana-rpc-client = "=3.1.12"
solana-rpc-client-api = "=3.1.12"
solana-sdk = "=3.0.0"
solana-sdk-ids = "=3.0.0"
spl-token = { version = "=9.0.0", default-features = false, features = ["no-entrypoint"] }

[dev-dependencies]
solana-banks-interface = "=3.1.12"
solana-program-test = "=3.1.12"
solana-system-interface = "=2.0.0"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync"] }

[lints.rust]
unsafe_code = "deny"
