- name: Mint event triggered
  inputs:
    # Sleep 65 seconds to ensure that the mint event happens in the epoch end hook
    - cmd: sleep 65
    # At this point there should be one mint event
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".denom") && printf "%s\n" "$value"
      env: DENOM
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".start_date") && printf "%s\n" "$value"
      env: START_DATE
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".end_date") && printf "%s\n" "$value"
      env: END_DATE
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".total_mint_amount") && printf "%s\n" "$value"
      env: TOTAL_MINT_AMOUNT
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".remaining_mint_amount") && printf "%s\n" "$value"
      env: REMAINING_MINT_AMOUNT
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".last_mint_amount") && printf "%s\n" "$value"
      env: LAST_MINT_AMOUNT
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".last_mint_date") && printf "%s\n" "$value"
      env: LAST_MINT_DATE
    - cmd: set -o pipefail; value=$(paxd q mint minter --output json | jq -er ".last_mint_height") && printf "%s\n" "$value"
      env: LAST_MINT_HEIGHT
    # Compare the total supply and make sure that it increased
    - cmd: set -o pipefail; value=$(paxd q bank total --output json | jq -er -M ".supply[] | select(.denom==\"uhpx\").amount") && printf "%s\n" "$value"
      env: TOTAL_SUPPLY
  verifiers:
    - type: eval
      expr: DENOM == "uhpx"
    # Start date should be equal to last mint date since there's only one mint on the first day
    - type: eval
      expr: START_DATE == LAST_MINT_DATE and END_DATE > START_DATE
    # Total Mint Amount = Remaining Mint Amount + Last Mint Amount
    - type: eval
      expr: TOTAL_MINT_AMOUNT == 999999999999
    - type: eval
      expr: REMAINING_MINT_AMOUNT == 666666666666
    - type: eval
      expr: LAST_MINT_AMOUNT == 333333333333
    - type: eval
      expr: LAST_MINT_HEIGHT == 0
    # Total supply should have gone up by LAST_MINT_AMOUNT
    - type: eval
      expr: TOTAL_SUPPLY == 5000000000333333333333
