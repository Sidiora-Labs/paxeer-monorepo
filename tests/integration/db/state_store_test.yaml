- name: Test state store iteration through wasm list code
  inputs:
    # Measure the existing codes at the recorded beginning height.
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_beginning_block_height.txt
      env: BEGINNING_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --count-total --limit 1 --height "$BEGINNING_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: BEGINNING_LIST_CODE_LENGTH
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --count-total --limit 1 --height "$BEGINNING_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: BEGINNING_LIST_CODE_LENGTH_REVERSE
    # Each fixture batch stores ten codes: 10 new codes at this height.
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_first_set_block_height.txt
      env: FIRST_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --count-total --limit 1 --height "$FIRST_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: FIRST_SET_LIST_CODE_LENGTH
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --count-total --limit 1 --height "$FIRST_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: FIRST_SET_LIST_CODE_LENGTH_REVERSE
    # Each fixture batch stores ten codes: 20 new codes at this height.
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_second_set_block_height.txt
      env: SECOND_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --count-total --limit 1 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: SECOND_SET_LIST_CODE_LENGTH
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --count-total --limit 1 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: SECOND_SET_LIST_CODE_LENGTH_REVERSE
    # Each fixture batch stores ten codes: 30 new codes at this height.
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_third_set_block_height.txt
      env: THIRD_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --count-total --limit 1 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: THIRD_SET_LIST_CODE_LENGTH
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --count-total --limit 1 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: THIRD_SET_LIST_CODE_LENGTH_REVERSE
  verifiers:
    - type: eval
      expr: BEGINNING_LIST_CODE_LENGTH_REVERSE == BEGINNING_LIST_CODE_LENGTH
    - type: eval
      expr: FIRST_SET_LIST_CODE_LENGTH - BEGINNING_LIST_CODE_LENGTH == 10
    - type: eval
      expr: FIRST_SET_LIST_CODE_LENGTH_REVERSE - BEGINNING_LIST_CODE_LENGTH == 10
    - type: eval
      expr: SECOND_SET_LIST_CODE_LENGTH - BEGINNING_LIST_CODE_LENGTH == 20
    - type: eval
      expr: SECOND_SET_LIST_CODE_LENGTH_REVERSE - BEGINNING_LIST_CODE_LENGTH == 20
    - type: eval
      expr: THIRD_SET_LIST_CODE_LENGTH - BEGINNING_LIST_CODE_LENGTH == 30
    - type: eval
      expr: THIRD_SET_LIST_CODE_LENGTH_REVERSE - BEGINNING_LIST_CODE_LENGTH == 30

- name: Test state store historical data checking specific wasm codes
  inputs:
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_creator_id.txt
      env: CREATOR_ID
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_beginning_block_height.txt
      env: BEGINNING_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --count-total --limit 1 --height "$BEGINNING_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: BEGINNING_LIST_CODE_LENGTH
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_first_set_block_height.txt
      env: FIRST_SET_BLOCK_HEIGHT
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_second_set_block_height.txt
      env: SECOND_SET_BLOCK_HEIGHT
    - cmd: >-
        tail -1 tests/integration/contracts/wasm_third_set_block_height.txt
      env: THIRD_SET_BLOCK_HEIGHT
    # Capture all ten fixture IDs and their metadata, independent of baseline IDs.
    # Query the same batches at later recorded heights in both iteration orders.
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$BEGINNING_LIST_CODE_LENGTH" --limit 10 --height "$FIRST_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 0 --limit 10 --height "$FIRST_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES_REVERSE
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$BEGINNING_LIST_CODE_LENGTH" --limit 10 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES_AT_SECOND_SET
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 10 --limit 10 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES_AT_SECOND_SET_REVERSE
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$((BEGINNING_LIST_CODE_LENGTH + 10))" --limit 10 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: SECOND_SET_CODES
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 0 --limit 10 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: SECOND_SET_CODES_REVERSE
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$BEGINNING_LIST_CODE_LENGTH" --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES_AT_THIRD_SET
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 20 --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: FIRST_SET_CODES_AT_THIRD_SET_REVERSE
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$((BEGINNING_LIST_CODE_LENGTH + 10))" --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: SECOND_SET_CODES_AT_THIRD_SET
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 10 --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: SECOND_SET_CODES_AT_THIRD_SET_REVERSE
    - cmd: >-
        set -o pipefail; paxd q wasm list-code
        --offset "$((BEGINNING_LIST_CODE_LENGTH + 20))" --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: THIRD_SET_CODES
    - cmd: >-
        set -o pipefail; paxd q wasm list-code --reverse
        --offset 0 --limit 10 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -ce --arg creator "$CREATOR_ID" '.code_infos |
        if length == 10 and all(.[];
        (.code_id | test("^[1-9][0-9]*$")) and .creator == $creator)
        then sort_by(.code_id | tonumber)
        else error("expected ten fixture codes from recorded creator") end'
      env: THIRD_SET_CODES_REVERSE
  verifiers:
    - type: eval
      expr: FIRST_SET_CODES_REVERSE == FIRST_SET_CODES
    - type: eval
      expr: FIRST_SET_CODES_AT_SECOND_SET == FIRST_SET_CODES
    - type: eval
      expr: FIRST_SET_CODES_AT_SECOND_SET_REVERSE == FIRST_SET_CODES
    - type: eval
      expr: SECOND_SET_CODES_REVERSE == SECOND_SET_CODES
    - type: eval
      expr: FIRST_SET_CODES_AT_THIRD_SET == FIRST_SET_CODES
    - type: eval
      expr: FIRST_SET_CODES_AT_THIRD_SET_REVERSE == FIRST_SET_CODES
    - type: eval
      expr: SECOND_SET_CODES_AT_THIRD_SET == SECOND_SET_CODES
    - type: eval
      expr: SECOND_SET_CODES_AT_THIRD_SET_REVERSE == SECOND_SET_CODES
    - type: eval
      expr: THIRD_SET_CODES_REVERSE == THIRD_SET_CODES

- name: Test state store iteration through tokenfactory denoms
  inputs:
    - cmd: >-
        tail -1 tests/integration/contracts/tfk_creator_id.txt
      env: CREATOR_ID
    # Capture this creator's existing denoms before the ten-item batches.
    - cmd: >-
        tail -1 tests/integration/contracts/tfk_beginning_block_height.txt
      env: BEGINNING_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q tokenfactory denoms-from-creator "$CREATOR_ID"
        --count-total --limit 1 --height "$BEGINNING_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: BEGINNING_TFK_DENOMS
    # Ten denoms per batch: 10 new denoms at this recorded height.
    - cmd: >-
        tail -1 tests/integration/contracts/tfk_first_set_block_height.txt
      env: FIRST_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q tokenfactory denoms-from-creator "$CREATOR_ID"
        --count-total --limit 1 --height "$FIRST_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: FIRST_SET_TFK_DENOMS
    # Ten denoms per batch: 20 new denoms at this recorded height.
    - cmd: >-
        tail -1 tests/integration/contracts/tfk_second_set_block_height.txt
      env: SECOND_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q tokenfactory denoms-from-creator "$CREATOR_ID"
        --count-total --limit 1 --height "$SECOND_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: SECOND_SET_TFK_DENOMS
    # Ten denoms per batch: 30 new denoms at this recorded height.
    - cmd: >-
        tail -1 tests/integration/contracts/tfk_third_set_block_height.txt
      env: THIRD_SET_BLOCK_HEIGHT
    - cmd: >-
        set -o pipefail; paxd q tokenfactory denoms-from-creator "$CREATOR_ID"
        --count-total --limit 1 --height "$THIRD_SET_BLOCK_HEIGHT" --output json
        | jq -er '.pagination.total | tonumber'
      env: THIRD_SET_TFK_DENOMS
  verifiers:
    # Compare denom deltas against the recorded baseline.
    - type: eval
      expr: FIRST_SET_TFK_DENOMS - BEGINNING_TFK_DENOMS == 10
    - type: eval
      expr: SECOND_SET_TFK_DENOMS - BEGINNING_TFK_DENOMS == 20
    - type: eval
      expr: THIRD_SET_TFK_DENOMS - BEGINNING_TFK_DENOMS == 30
