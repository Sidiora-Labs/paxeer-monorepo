- name: Test Authz staking authorization
  inputs:
    # Get admin addr
    - cmd: printf "12345678\n" | paxd keys list --output json | jq ".[] | select (.name==\"admin\")" | jq -r .address
      env: ADMIN_ADDR
    # Get node_admin addr
    - cmd: printf "12345678\n" | paxd keys list --output json | jq ".[] | select (.name==\"node_admin\")" | jq -r .address
      env: NODE_ADMIN_ADDR
    # Get node_admin val addr
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: NODE_ADMIN_VAL_ADDR
    # create new grantee addr
    - cmd: printf "12345678\ny\n" | paxd keys add grantee --output json | jq -r ".address"
      env: GRANTEE_ADDR
    # send some funds to grantee for gas
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin bank send admin $GRANTEE_ADDR 1pax --fees 2000uhpx
    # create an authz grant for delegating
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin authz grant $GRANTEE_ADDR delegate --allowed-validators "$NODE_ADMIN_VAL_ADDR" --fees 2000uhpx
    # create delegate tx and write to json
    - cmd: printf "12345678\n" | paxd tx staking delegate $NODE_ADMIN_VAL_ADDR 1pax --from $ADMIN_ADDR --generate-only > delegate_tx.json
    # execute the authz tx - we want to validate that this succeeds with code 0
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait $GRANTEE_ADDR authz exec delegate_tx.json --fees 2000uhpx
      env: AUTHZ_1_ERROR_CODE
    # create unbond tx and write to json
    - cmd: printf "12345678\n" | paxd tx staking unbond $NODE_ADMIN_VAL_ADDR 1pax --from $ADMIN_ADDR --generate-only > unbond_tx.json
    # Require the committed missing-authorization rejection before granting unbond.
    - cmd: python3 tests/integration/authz_module/authz_evidence.py exec "$GRANTEE_ADDR" unbond_tx.json unbond-denied
      env: AUTHZ_2_ERROR_CODE
    # query delegation amount - proves the delegate succeeded (1000000) and
    # the unbond above was rejected (would otherwise be 0).
    - cmd: paxd q staking delegation $ADMIN_ADDR $NODE_ADMIN_VAL_ADDR --output json | jq -r ".balance.amount"
      env: STAKING_AMOUNT
    # grant the authorization for unbond
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin authz grant $GRANTEE_ADDR unbond --allowed-validators "$NODE_ADMIN_VAL_ADDR" --fees 2000uhpx
    # unbond should succeed this time
    - cmd: python3 tests/integration/authz_module/authz_evidence.py exec "$GRANTEE_ADDR" unbond_tx.json unbond-success
      env: AUTHZ_3_ERROR_CODE
    # Only the specific missing-delegation error for this address pair means zero.
    - cmd: python3 tests/integration/authz_module/authz_evidence.py delegation "$ADMIN_ADDR" "$NODE_ADMIN_VAL_ADDR"
      env: STAKING_AMOUNT_AFTER_UNBOND
  verifiers:
    # verify that error code == 0 for first authz exec
    - type: eval
      expr: AUTHZ_1_ERROR_CODE == 0
    - type: eval
      expr: AUTHZ_2_ERROR_CODE == 4
    # delegate succeeded and the unauthorized unbond was rejected
    - type: eval
      expr: STAKING_AMOUNT == 1000000
    # verify that error code == 0 for unbond after granted authorization
    - type: eval
      expr: AUTHZ_3_ERROR_CODE == 0
    # full delegation was unbonded
    - type: eval
      expr: STAKING_AMOUNT_AFTER_UNBOND == 0
