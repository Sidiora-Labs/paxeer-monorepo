- name: prefix with trailing output
  inputs:
    - cmd: command-fixture:prefix
      env: OUTPUT
  verifiers:
    - type: regex
      result: OUTPUT
      expr: PASS
- name: leading unmatched output
  inputs:
    - cmd: command-fixture:leading
      env: OUTPUT
  verifiers:
    - type: regex
      result: OUTPUT
      expr: PASS
- name: unanchored alternative after leading output
  inputs:
    - cmd: command-fixture:leading
      env: OUTPUT
  verifiers:
    - type: regex
      result: OUTPUT
      expr: 'READY|PASS'
- name: multiline anchors still require offset zero
  inputs:
    - cmd: command-fixture:leading
      env: OUTPUT
  verifiers:
    - type: regex
      result: OUTPUT
      expr: '(?m)^PASS'
- name: explicit leading wildcard
  inputs:
    - cmd: command-fixture:leading
      env: OUTPUT
  verifiers:
    - type: regex
      result: OUTPUT
      expr: '(?s).*PASS'
