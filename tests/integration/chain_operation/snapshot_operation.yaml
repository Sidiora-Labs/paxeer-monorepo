- name: Test validators should be able to create snapshot with custom location
  inputs:
    - cmd: >-
        set -euo pipefail;
        python3 tests/integration/chain_operation/snapshot_probe.py prepare
        --snapshot-dir ./build/generated/node_0/snapshots
      env: BOOTSTRAP
      node: pax-node-0
    - cmd: >-
        set -euo pipefail;
        python3 tests/integration/chain_operation/snapshot_probe.py restore
        --bootstrap "$BOOTSTRAP"
      env: IMPORT
      node: pax-node-0
    - cmd: >-
        set -euo pipefail;
        python3 tests/integration/chain_operation/snapshot_probe.py compare
        --bootstrap "$BOOTSTRAP" --evidence "$IMPORT"
        --snapshot-dir ./build/generated/node_0/snapshots
      env: RESTORED
      node: pax-node-0
  verifiers:
    - type: eval
      expr: RESTORED == "verified"
