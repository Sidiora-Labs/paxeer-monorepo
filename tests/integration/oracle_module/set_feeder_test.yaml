- name: Test setting a different feeder account
  inputs:
    # Get admin addr
    - cmd: printf "12345678\n" | paxd keys list --output json | jq ".[] | select (.name==\"node_admin\")" | jq -r .address
      env: ADMIN_ADDR
    # Get admin val addr
    - cmd: printf "12345678\n" | paxd keys show node_admin --bech val --output json | jq -r ".address"
      env: ADMIN_VAL_ADDR
    # create new feeder addr
    - cmd: printf "12345678\ny\n" | paxd keys add integration_test_feeder --output json | jq -r ".address"
      env: NEW_FEEDER_ADDR
    # get old feeder addr
    - cmd: paxd q oracle feeder $ADMIN_VAL_ADDR --output json | jq -r ".feeder_addr"
      env: OLD_FEEDER_ADDR
    # send bank funds to new feeder to populate account
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin bank send admin $NEW_FEEDER_ADDR 1pax --fees 2000uhpx
    # set feeder
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait node_admin oracle set-feeder $NEW_FEEDER_ADDR --fees 2000uhpx
      env: SET_FEEDER_ERROR_CODE
    # Prove that the committed delegation changed before voting.
    - cmd: set -euo pipefail; feeder=$(paxd q oracle feeder "$ADMIN_VAL_ADDR" --output json | jq -er .feeder_addr); test "$feeder" = "$NEW_FEEDER_ADDR"; printf "%s\n" "$feeder"
      env: COMMITTED_FEEDER_ADDR
    - cmd: set -euo pipefail; paxd status | jq -er ".SyncInfo.latest_block_height | select(test(\"^[1-9][0-9]*$\"))"
      env: VOTE_START_HEIGHT
    # Retain the exact vote hash and prove its execution without the tx indexer.
    - cmd: printf "12345678\n" | paxd tx oracle aggregate-vote 1.5ueth "$ADMIN_VAL_ADDR" --from "$NEW_FEEDER_ADDR" --gas 0 -y --chain-id=pax --broadcast-mode=sync --output=json
      env: NEW_FEEDER_VOTE_RESPONSE
    - cmd: bash tests/integration/oracle_module/verify_committed_vote.sh "$NEW_FEEDER_VOTE_RESPONSE" "$VOTE_START_HEIGHT" "$ADMIN_VAL_ADDR" "$NEW_FEEDER_ADDR" 1.5ueth
      env: NEW_FEEDER_VOTE_ERROR_CODE
    # set old feeder addr again
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait node_admin oracle set-feeder $OLD_FEEDER_ADDR --fees 2000uhpx
      env: RESTORE_FEEDER_ERROR_CODE
    - cmd: set -euo pipefail; feeder=$(paxd q oracle feeder "$ADMIN_VAL_ADDR" --output json | jq -er .feeder_addr); test "$feeder" = "$OLD_FEEDER_ADDR"; printf "%s\n" "$feeder"
      env: RESTORED_FEEDER_ADDR
  verifiers:
    - type: eval
      expr: SET_FEEDER_ERROR_CODE == 0
    - type: eval
      expr: COMMITTED_FEEDER_ADDR == NEW_FEEDER_ADDR
    - type: eval
      expr: NEW_FEEDER_VOTE_ERROR_CODE == 0
    - type: eval
      expr: RESTORE_FEEDER_ERROR_CODE == 0
    - type: eval
      expr: RESTORED_FEEDER_ADDR == OLD_FEEDER_ADDR
