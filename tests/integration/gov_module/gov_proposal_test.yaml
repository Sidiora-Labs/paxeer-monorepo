- name: Test making a proposal which got rejected should burn tokens
  inputs:
    # Capture supply at a committed height before submitting this proposal.
    - cmd: set -euo pipefail; paxd status | jq -er '.SyncInfo.latest_block_height | tonumber | select(. > 0)'
      env: PRE_PROPOSAL_HEIGHT
    - cmd: set -euo pipefail; paxd q bank total --denom uhpx --height "$PRE_PROPOSAL_HEIGHT" --output json | jq -er .amount
      env: TOTAL_SUPPLY_BEFORE_BURN
    # Make a new expedited proposal
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_gov_proposal admin "Gov Param Change Expedited" gov submit-proposal param-change ./tests/integration/gov_module/proposal/expedited_proposal.json --fees 2000uhpx
      env: PROPOSAL_ID
    # Get proposal status
    - cmd: paxd q gov proposal $PROPOSAL_ID --output json | jq -r .status
      env: PROPOSAL_STATUS
    # Make a deposit
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin gov deposit $PROPOSAL_ID 10000000uhpx --fees 2000uhpx
    # only pax-node-0 vote yes
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait node_admin gov vote $PROPOSAL_ID yes --fees 2000uhpx
      node: pax-node-0
    # Expedited failure converts to regular voting; wait for final rejection.
    - cmd: |
        set -euo pipefail
        deadline=$((SECONDS + 90))
        query() {
          remaining=$((deadline - SECONDS))
          if (( remaining <= 0 )); then
            echo "Deadline exceeded for proposal $PROPOSAL_ID" >&2
            exit 1
          fi
          timeout "${remaining}s" paxd "$@"
        }
        while (( SECONDS < deadline )); do
          height=$(query status | jq -er '.SyncInfo.latest_block_height | tonumber | select(. > 0)')
          status=$(query q gov proposal "$PROPOSAL_ID" --height "$height" --output json | jq -er .status)
          case "$status" in
            PROPOSAL_STATUS_REJECTED) printf '%s\n' "$height"; exit 0 ;;
            PROPOSAL_STATUS_PASSED|PROPOSAL_STATUS_FAILED)
              echo "Proposal $PROPOSAL_ID reached unexpected $status" >&2
              exit 1 ;;
            PROPOSAL_STATUS_DEPOSIT_PERIOD|PROPOSAL_STATUS_VOTING_PERIOD) ;;
            *) echo "Unknown proposal status: $status" >&2; exit 1 ;;
          esac
          sleep 1
        done
        echo "Deadline exceeded for proposal $PROPOSAL_ID" >&2
        exit 1
      env: POST_EXECUTION_HEIGHT
    - cmd: paxd q gov proposal "$PROPOSAL_ID" --height "$POST_EXECUTION_HEIGHT" --output json | jq -r .status
      env: PROPOSAL_STATUS
    # Get the tally params again after proposal is passed
    - cmd: paxd q gov params --height "$POST_EXECUTION_HEIGHT" --output json | jq -r .tally_params.expedited_quorum
      env: NEW_PARAM
    # Measure the same denom at the committed rejection height.
    - cmd: set -euo pipefail; paxd q bank total --denom uhpx --height "$POST_EXECUTION_HEIGHT" --output json | jq -er .amount
      env: TOTAL_SUPPLY_AFTER_BURN
  verifiers:
    # Both the proposal's initial deposit and the subsequent deposit must burn.
    - type: eval
      expr: PROPOSAL_STATUS == "PROPOSAL_STATUS_REJECTED"
    - type: eval
      expr: POST_EXECUTION_HEIGHT > PRE_PROPOSAL_HEIGHT
    - type: eval
      expr: TOTAL_SUPPLY_BEFORE_BURN - TOTAL_SUPPLY_AFTER_BURN == 20000000
