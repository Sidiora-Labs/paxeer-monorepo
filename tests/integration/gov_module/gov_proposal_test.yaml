- name: Test making a new param change proposal should pass and take effect
  inputs:
    # Get the current tally params
    - cmd: paxd q gov params --output json | jq -r .tally_params.quorum
      env: OLD_PARAM
    # Make a new proposal
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_gov_proposal admin "Gov Param Change" gov submit-proposal param-change ./tests/integration/gov_module/proposal/param_change_proposal.json --fees 2000uhpx
      env: PROPOSAL_ID
    # Get proposal status
    - cmd: paxd q gov proposal $PROPOSAL_ID --output json | jq -r .status
      env: PROPOSAL_STATUS
    # Make a deposit
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait admin gov deposit $PROPOSAL_ID 10000000uhpx --fees 2000uhpx
    # pax-node-0 vote yes
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait node_admin gov vote $PROPOSAL_ID yes --fees 2000uhpx
      node: pax-node-0
    # pax-node-1 vote yes
    - cmd: paxd q gov proposal $PROPOSAL_ID --output json | jq -r .status
    - cmd: paxdbin=paxd; chainid=pax; source tests/integration/utils/_tx_helpers.sh && submit_tx_and_wait node_admin gov vote $PROPOSAL_ID yes --fees 2000uhpx
      node: pax-node-1
    # Poll this proposal at committed heights until execution succeeds.
    - cmd: |
        set -euo pipefail
        deadline=$((SECONDS + 90))
        query() {
          remaining=$((deadline - SECONDS))
          if (( remaining <= 0 )); then
            echo "Deadline exceeded for proposal $PROPOSAL_ID" >&2
            exit 1
          fi
          timeout "${remaining}s" paxd "$@"
        }
        while (( SECONDS < deadline )); do
          height=$(query status | jq -er '.SyncInfo.latest_block_height | tonumber | select(. > 0)')
          status=$(query q gov proposal "$PROPOSAL_ID" --height "$height" --output json | jq -er .status)
          case "$status" in
            PROPOSAL_STATUS_PASSED) printf '%s\n' "$height"; exit 0 ;;
            PROPOSAL_STATUS_REJECTED|PROPOSAL_STATUS_FAILED)
              echo "Proposal $PROPOSAL_ID reached unexpected $status" >&2
              exit 1 ;;
            PROPOSAL_STATUS_DEPOSIT_PERIOD|PROPOSAL_STATUS_VOTING_PERIOD) ;;
            *) echo "Unknown proposal status: $status" >&2; exit 1 ;;
          esac
          sleep 1
        done
        echo "Deadline exceeded for proposal $PROPOSAL_ID" >&2
        exit 1
      env: POST_EXECUTION_HEIGHT
    - cmd: paxd q gov proposal "$PROPOSAL_ID" --height "$POST_EXECUTION_HEIGHT" --output json | jq -r .status
      env: PROPOSAL_STATUS
    # Get the tally params again after proposal is passed
    - cmd: paxd q gov params --height "$POST_EXECUTION_HEIGHT" --output json | jq -r .tally_params.quorum
      env: NEW_TALLY_PARAM
    - cmd: paxd q params subspace baseapp ABCIParams --height "$POST_EXECUTION_HEIGHT" --output json |jq -r .value |jq .recheck_tx
      env: NEW_ABCI_PARAM
  verifiers:
    - type: eval
      expr: PROPOSAL_STATUS == "PROPOSAL_STATUS_PASSED"
    # Check if the new params matches the expected value after proposal
    - type: eval
      expr: NEW_TALLY_PARAM == 0.450000000000000000
    - type: eval
      expr: NEW_ABCI_PARAM == "true"

