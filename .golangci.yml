version: "2"
run:
  tests: false
  timeout: 10m
  build-tags:
    - codeanalysis

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - goconst
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - staticcheck
    - unconvert
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
    rules:
      - linters:
          - gosec
        text: "Use of weak random number generator"

      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^services/bridge/deploy/appenv/appenv\\.go$"
        linters: [gosec]
        text: "^(?:G304:\\ Potential\\ file\\ inclusion\\ via\\ variable)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^services/bridge/deploy/appenv/solana\\.go$"
        linters: [errcheck]
        text: "^(?:Error\\ return\\ value\\ of\\ `directory\\.Close`\\ is\\ not\\ checked|Error\\ return\\ value\\ of\\ `file\\.Close`\\ is\\ not\\ checked|Error\\ return\\ value\\ of\\ `os\\.Remove`\\ is\\ not\\ checked)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^services/bridge/deploy/chainconfig/overlay\\.go$"
        linters: [errcheck]
        text: "^(?:Error\\ return\\ value\\ of\\ `file\\.Close`\\ is\\ not\\ checked)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
