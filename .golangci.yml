        linters: [gosec]
        text: "^(?:G304:\\ Potential\\ file\\ inclusion\\ via\\ variable)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^services/bridge/deploy/cmd/paxeer\\-bridge\\-app\\-env/main\\.go$"
        linters: [errcheck]
        text: "^(?:Error\\ return\\ value\\ of\\ `fmt\\.Fprintln`\\ is\\ not\\ checked)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^services/bridge/deploy/proposals/manifest\\.go$"
        linters: [gosec]
        text: "^(?:G304:\\ Potential\\ file\\ inclusion\\ via\\ variable)$"
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^tools/flyci/controller/config\\.go$"
        linters: [goconst]
      # Scoped wiring request: see repair_22_39_4.kvx.
      - path: "^tools/flyci/controller/github\\.go$"
