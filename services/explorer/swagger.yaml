components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: _explorer_key
      description: Phoenix session cookie set after /api/account/v2 authentication
    apiKey:
      type: apiKey
      in: query
      name: apikey
      description: API key that lifts the per-IP rate limit
  responses:
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    InvalidParameter:
      description: Invalid parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
    Unauthorized:
      description: Not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Message'
