            application/json:
              schema:
                $ref: '#/components/schemas/PaxeerXCapabilities'
          description: Surfaces the connected node answers.
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JsonErrorResponse'
          description: Unprocessable Entity
      summary: Get the live Paxeer X Network surfaces
      tags:
      - paxeer-x
      x-controller: BlockScoutWeb.V2.PaxeerX.CapabilitiesController.capabilities
      x-source: OpenApiSpex export
