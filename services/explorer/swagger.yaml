  /api/v1/eth-rpc:
    post:
      tags:
      - eth-rpc
      summary: JSON-RPC 2.0 endpoint (/api/v1/eth-rpc)
      description: Ethereum JSON-RPC methods served from the explorer database. A request may be a single object or a batch
        array.
      operationId: eth_rpc_api_v1_eth_rpc
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/JsonRpcRequest'
              - type: array
                items:
                  $ref: '#/components/schemas/JsonRpcRequest'
      responses:
        '200':
          description: JSON-RPC response or batch of responses
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/JsonRpcResponse'
                - type: array
                  items:
                    $ref: '#/components/schemas/JsonRpcResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
      x-supported-methods: *id143
  /api/v1/graphql:
    post:
      tags:
      - graphql
      summary: GraphQL query
      description: Absinthe GraphQL endpoint over the explorer schema (see GET /schema.graphql). Complexity and token limits
        apply.
      operationId: graphql_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQLRequest'
          application/graphql:
            schema:
              type: string
      responses: &id144
        '200':
          description: GraphQL result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQLResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
      - graphql
      summary: GraphQL query via query string
      operationId: graphql_get
      parameters:
      - name: query
        in: query
        required: true
        schema:
          type: string
      - name: variables
        in: query
        required: false
        schema:
          type: string
        description: JSON-encoded variables
      - name: operationName
        in: query
        required: false
        schema:
          type: string
      responses: *id144
  /graphiql:
    get:
      tags:
      - graphql
      summary: GraphiQL interactive explorer
      operationId: graphiql
      responses:
        '200':
          description: HTML page
          content:
            text/html:
              schema:
                type: string
  /schema.graphql:
    get:
