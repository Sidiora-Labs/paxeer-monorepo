openapi: 3.0.3
info:
  title: Paxeer Explorer API
  version: 10.2.6
  description: Every HTTP route served by the Paxeer explorer backend (Blockscout fork) as compiled for CHAIN_TYPE=paxeer_x.
    Generated from the Phoenix routers, the OpenApiSpex operation specs of the API v2 controllers and the RPC documentation
    module by deploy/tools/gen-swagger.py. 226 operations across 195 paths. The legacy server-rendered web app (DISABLE_WEBAPP,
    default true) is excluded; pass --include-web to add it. The admin panel (ADMIN_PANEL_ENABLED, default false) is excluded;
    pass --include-admin to add it. The backend also serves its own OpenApiSpex document at GET /api/v2/openapi.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
servers:
- url: /
  description: Same origin as the explorer
tags:
- name: paxeer-x
  description: 'Paxeer X Network surfaces: capabilities, anchors, kernel receipts, price feed, settlement status and sequencer
    signatures'
- name: search
- name: config
- name: stats
- name: main-page
- name: blocks
- name: transactions
- name: token-transfers
- name: internal-transactions
- name: addresses
- name: tokens
- name: smart-contracts
- name: withdrawals
- name: advanced-filters
- name: proxy
- name: import
- name: key
- name: utils
- name: scam-badge-addresses
- name: account
  description: My-account API (watchlists, tags, API keys, custom ABIs) and authentication; session cookie required
- name: health
  description: Liveness, readiness and indexing health
- name: api-v1
  description: Legacy v1 JSON endpoints
- name: rpc
  description: Etherscan-compatible module/action API (/api and /api/v1)
- name: eth-rpc
  description: Ethereum JSON-RPC served from the explorer database
- name: graphql
  description: GraphQL endpoint and schema
- name: site
  description: Site metadata and documentation pages
- name: api-v2
  description: Catch-all for unknown API v2 paths
paths:
  /api/v2/paxeer-x/anchors:
    get:
      callbacks: {}
      description: 'Retrieves a paginated list of anchor checkpoints, newest batch first, one row per batch: a checkpoint
        is logged again every time it climbs a rung of the anchor ladder, and the newest row of the batch is the one the page
        carries.'
      operationId: BlockScoutWeb.API.V2.PaxeerX.AnchorController.anchors
      parameters:
      - description: API key for rate limiting or for sensitive endpoints
        in: query
        name: apikey
        required: false
        schema:
          type: string
          x-struct: null
          x-validate: null
      - description: Secret key for getting access to restricted resources
        in: query
        name: key
        required: false
        schema:
          type: string
          x-struct: null
          x-validate: null
      - description: Anchor batch number for paging
        in: query
        name: batch_number
        required: false
        schema:
          minimum: 0
          type: integer
          x-struct: null
          x-validate: null
      - description: Number of items returned per page
        in: query
        name: items_count
        required: false
        schema:
          maximum: 50
          minimum: 1
          type: integer
          x-struct: null
          x-validate: null
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: false
                nullable: false
                properties:
                  items:
                    items:
                      $ref: '#/components/schemas/PaxeerXAnchor'
                    nullable: false
                    type: array
                    x-struct: null
                    x-validate: null
                  next_page_params:
                    example:
                      batch_number: 2
                      items_count: 50
                    nullable: true
                    type: object
                    x-struct: null
                    x-validate: null
                required:
                - items
                - next_page_params
                type: object
                x-struct: null
                x-validate: null
          description: Anchor checkpoints with pagination.
      summary: List the anchor checkpoints of Paxeer X Network
      tags:
      - paxeer-x
      x-controller: BlockScoutWeb.V2.PaxeerX.AnchorController.anchors
      x-source: OpenApiSpex export
  /api/v2/paxeer-x/capabilities:
    get:
      callbacks: {}
      description: 'Returns one boolean per LayerX surface precompile — addr, custody, anchor, exchange, bridge, launchpad
        — as of the last probe of the connected node. `addr` is true when the addr precompile answers getUnifiedAccount. A
        surface that the running chain does not carry yet reads as false. `price_feed` is present, and true, only while native
        price-feed submissions are served: the node indexes them itself or its database holds price-feed blocks scanned by
        another indexer.'
      operationId: BlockScoutWeb.API.V2.PaxeerX.CapabilitiesController.capabilities
      parameters:
      - description: API key for rate limiting or for sensitive endpoints
        in: query
        name: apikey
        required: false
        schema:
          type: string
          x-struct: null
          x-validate: null
      - description: Secret key for getting access to restricted resources
        in: query
        name: key
        required: false
        schema:
          type: string
          x-struct: null
          x-validate: null
      responses:
