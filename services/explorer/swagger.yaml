  /api/v1:
    get:
      tags:
      - rpc
      summary: Etherscan-style RPC call (GET) at /api/v1
      description: 'Etherscan-compatible RPC API. Every call is `?module=<module>&action=<action>` plus the action''s own
        parameters; GET and POST (form or JSON body) are equivalent. The response envelope is `{"status": "1"|"0", "message":
        "OK"|<error>, "result": ...}`. The full table of module/action pairs with their required and optional parameters is
        in the `x-rpc-actions` extension of this operation.'
      operationId: rpc_get_api_v1
      parameters: &id001
      - name: module
        in: query
        required: true
        schema:
          type: string
          enum:
          - block
          - account
          - logs
          - token
          - stats
          - contract
          - transaction
        description: RPC module
      - name: action
        in: query
        required: true
        schema:
          type: string
          enum:
          - balance
          - balancemulti
          - bridgedtokenlist
          - checkproxyverification
          - checkverifystatus
          - coinprice
          - coinsupply
          - eth_block_number
          - eth_get_balance
          - ethprice
          - ethsupply
          - ethsupplyexchange
          - getabi
          - getblockcountdown
          - getblocknobytime
          - getblockreward
          - getcontractcreation
          - getlogs
          - getminedblocks
          - getsourcecode
          - getstatus
          - gettoken
          - gettokenholders
          - gettxinfo
          - gettxreceiptstatus
          - listaccounts
          - listcontracts
          - pendingtxlist
          - token1155tx
          - token404tx
          - token7984tx
          - tokenbalance
          - tokenlist
          - tokennfttx
          - tokensupply
          - tokentx
          - totalfees
          - txlist
          - txlistinternal
          - verify
          - verify_via_sourcify
          - verify_vyper_contract
          - verifyproxycontract
          - verifysourcecode
        description: RPC action of the module; see x-rpc-actions for the parameters of each module/action pair
      - name: apikey
        in: query
        required: false
        schema:
          type: string
        description: API key for rate limiting
      - name: address
        in: query
        required: false
        schema:
          type: string
        description: 'A 160-bit code used for identifying Accounts. Used by: account.balance, account.balancemulti, account.eth_get_balance,
          account.getminedblocks, account.pendingtxlist, account.tokenbalance, account.tokenlist, account.tokentx, account.txlist,
          account.txlistinternal, contract.getabi, contract.getsourcecode, logs.getlogs.'
      - name: addressHash
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the contract. Used by: contract.verify, contract.verify_via_sourcify, contract.verify_vyper_contract.'
      - name: autodetectConstructorArguments
        in: query
        required: false
        schema:
          type: string
        description: 'Whether or not automatically detect constructor argument. Used by: contract.verify, contract.verifysourcecode.'
      - name: block
        in: query
        required: false
        schema:
          type: string
        description: |-
          Either the block number as a string, or one of latest, earliest or pending

          latest will be the latest balance in a *consensus* block.
          earliest will be the first recorded balance for the address.
          pending will be the latest balance in consensus *or* nonconsensus blocks. Used by: account.eth_get_balance.
      - name: blockno
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the block number. Used by: block.getblockreward.'
      - name: chainid
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the chain id, where original token exists. Used by: token.bridgedtokenlist.'
      - name: closest
        in: query
        required: false
        schema:
          type: string
        description: 'Direction to find the closest block number to given timestamp. Available values: before/after. Used
          by: block.getblocknobytime.'
      - name: codeformat
        in: query
        required: false
        schema:
          type: string
        description: 'Format of sourceCode(supported only "solidity-standard-json-input") Used by: contract.verifysourcecode.'
      - name: compilerVersion
        in: query
        required: false
        schema:
          type: string
        description: 'The compiler version for the contract. Used by: contract.verify, contract.verify_vyper_contract.'
      - name: compilerversion
        in: query
        required: false
        schema:
          type: string
        description: 'The compiler version for the contract. Used by: contract.verifysourcecode.'
      - name: constructorArguments
        in: query
        required: false
        schema:
          type: string
        description: 'The constructor argument data provided. Used by: contract.verify, contract.verify_vyper_contract, contract.verifysourcecode.'
      - name: contractSourceCode
        in: query
        required: false
        schema:
          type: string
        description: 'The source code of the contract. Used by: contract.verify, contract.verify_vyper_contract.'
      - name: contractaddress
        in: query
        required: false
        schema:
          type: string
        description: 'A 160-bit code used for identifying contracts. Used by: account.tokenbalance, account.tokentx, contract.verifysourcecode,
          stats.tokensupply, token.gettoken, token.gettokenholders.'
      - name: contractname
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the contract. It could be empty string(""), just contract name("ContractName"), or filename
          and contract name("contracts/contract_1.sol:ContractName") Used by: contract.verifysourcecode.'
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: 'day in ISO 8601 format (yyyy-mm-dd) Used by: stats.totalfees.'
      - name: end_timestamp
        in: query
        required: false
        schema:
          type: string
        description: 'Represents the ending block timestamp. Used by: account.txlist.'
      - name: endblock
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the ending block number. Used by: account.tokentx, account.txlist,
          account.txlistinternal.'
      - name: evmVersion
        in: query
        required: false
        schema:
          type: string
        description: 'The EVM version for the contract. Used by: contract.verify.'
      - name: files
        in: query
        required: false
        schema:
          type: string
        description: 'Array with sources and metadata files Used by: contract.verify_via_sourcify.'
      - name: filter
        in: query
        required: false
        schema:
          type: string
        description: 'verified|unverified|empty, or 1|2|3 respectively. This requests only contracts with that status. Used
          by: contract.listcontracts.'
      - name: filter_by
        in: query
        required: false
        schema:
          type: string
        description: |-
          A string representing the field to filter by. If none is given
          it returns transactions that match to, from, or contract address.
          Available values: to, from Used by: account.txlist.
      - name: fromBlock
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the starting block number. The use of ''latest'' is also supported.
          Used by: logs.getlogs.'
      - name: guid
        in: query
        required: false
        schema:
          type: string
        description: 'A string used for identifying verification attempt Used by: contract.checkverifystatus.'
      - name: id
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the json rpc request id. Used by: block.eth_block_number.'
      - name: index
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the log index to be used for pagination. Used by: transaction.gettxinfo.'
      - name: library1Address
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the first library used. Used by: contract.verify.'
      - name: library1Name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the first library used. Used by: contract.verify.'
      - name: library2Address
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the second library used. Used by: contract.verify.'
      - name: library2Name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the second library used. Used by: contract.verify.'
      - name: library3Address
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the third library used. Used by: contract.verify.'
      - name: library3Name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the third library used. Used by: contract.verify.'
      - name: library4Address
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the fourth library used. Used by: contract.verify.'
      - name: library4Name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the fourth library used. Used by: contract.verify.'
      - name: library5Address
        in: query
        required: false
        schema:
          type: string
        description: 'The address of the fourth library used. Used by: contract.verify.'
      - name: library5Name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the fourth library used. Used by: contract.verify.'
      - name: name
        in: query
        required: false
        schema:
          type: string
        description: 'The name of the contract. Used by: contract.verify, contract.verify_vyper_contract.'
      - name: offset
        in: query
        required: false
        schema:
          type: integer
        description: 'A nonnegative integer that represents the maximum number of records to return when paginating. ''page''
          must be provided in conjunction. Used by: account.getminedblocks, account.listaccounts, account.pendingtxlist, account.tokentx,
          account.txlist, account.txlistinternal, contract.listcontracts, token.bridgedtokenlist, token.gettokenholders.'
      - name: optimization
        in: query
        required: false
        schema:
          type: string
        description: 'Whether or not compiler optimizations were enabled. Used by: contract.verify.'
      - name: optimizationRuns
        in: query
