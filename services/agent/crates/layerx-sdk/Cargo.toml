[package]
name = "layerx-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[package.metadata.test-fixtures]
tls = "tests/fixtures/repair_22_31_227_fixture"
private-ca = "tests/fixtures/repair_22_33_1564_fixture"

[package.metadata.proof.agent-wallet-rpc]
test = "services/agent/crates/layerx-sdk/tests/proof_layerx_wallet_rpc.rs"
producer = "test-owned loopback JSON-RPC listener"
clock = "test-owned private runtime-clock protocol listener"

[dependencies]
layerx-types = { path = "../layerx-types" }
layerx-client = { path = "../layerx-client" }
layerx-agent-api = { path = "../layerx-agent-api" }
layerx-crypto = { path = "../layerx-crypto" }
layerx-proof = { path = "../layerx-proof" }
layerx-wire = { path = "../layerx-wire" }
layerx-mirror = { path = "../../../../services/interop/crates/layerx-mirror" }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
ureq = { version = "=3.4.0", default-features = false, features = ["rustls-no-provider", "_ring"] }
rustls-native-certs = "=0.8.4"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
url = "=2.5.8"
tungstenite = { version = "=0.29.0", features = ["rustls-tls-native-roots"] }
zeroize = "=1.9.0"

ed25519-dalek = "=2.2.0"

[dev-dependencies]
layerx_programs_registry = { package = "layerx-programs-registry", version = "=0.1.0", path = "../../../../programs/crates/layerx-programs-registry" }
layerx-agentd = { path = "../layerx-agentd" }
layerx-identity-binding = { path = "../layerx-identity-binding" }
hex = "=0.4.3"
getrandom = "=0.3.4"
native-tls = "=0.2.18"
openssl = "=0.10.81"
ureq = { version = "=3.4.0", default-features = false, features = ["json", "rustls-no-provider", "_ring"] }

[lints]
workspace = true
