[workspace]
members = [
    "crates/layerx-types",
    "crates/layerx-wire",
    "crates/layerx-crypto",
    "crates/layerx-proof",
    "crates/layerx-client",
    "crates/layerx-identity-binding",
    "crates/layerx-agent-api",
    # The owner library and executable host are separate workspace packages.
    "crates/layerx-agentd",
    # This host builds layerx-agentd/src/main.rs, the sole clock exception.
    "crates/layerx-agentd-host",
    "crates/layerx-mcp",
    "crates/layerx-sdk",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.91.1"
version = "0.1.0"
license = "Apache-2.0"

[workspace.lints.rust]
# Clock boundaries are checked separately by tools/boundary-check using
# nondeterminism-allowlist.toml; workspace membership grants no exemption.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
