[package]
name = "layerx-gateway-local-qualification"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
float_arithmetic = "deny"
lossy_float_literal = "deny"

[dependencies]
layerx-sdk = { path = "../../../../../../services/agent/crates/layerx-sdk" }
layerx-proof = { path = "../../../../../../services/agent/crates/layerx-proof" }
layerx-platform-core = { path = "../../../core" }
layerx-platform-authority = { path = "../../../authority" }
serde_json = "1"
layerx-types = { path = "../../../../../../services/agent/crates/layerx-types" }
layerx-wire = { path = "../../../../../../services/agent/crates/layerx-wire" }

[[bin]]
name = "gateway-lifecycle-receipt-verify"
path = "verifier.rs"

[[bin]]
name = "gateway-lifecycle-sdk-verify"
path = "lifecycle_sdk.rs"
