apiVersion: v1
kind: ConfigMap
metadata: {name: layerx-gateway-redis-config, namespace: layerx-mainnet-beta}
data:
  redis.conf: |
    bind 0.0.0.0
    port 0
    tls-port 6379
    tls-cert-file /run/layerx/tls/tls.crt
    tls-key-file /run/layerx/tls/tls.key
    tls-ca-cert-file /run/layerx/tls/ca.crt
    tls-auth-clients no
    aclfile /run/layerx/auth/users.acl
    appendonly yes
    appendfsync always
    maxmemory-policy noeviction
    protected-mode yes
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: layerx-gateway-redis, namespace: layerx-mainnet-beta}
spec:
  serviceName: layerx-gateway-redis
  replicas: 1
  selector: {matchLabels: {app: layerx-gateway-redis}}
  template:
    metadata: {labels: {app: layerx-gateway-redis, layerx-plane: state}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 4020, runAsGroup: 4020, fsGroup: 4020}
      containers:
        - name: redis
          image: redis:8.2.1-alpine
          args: [redis-server, /etc/layerx/redis.conf]
          ports: [{name: rediss, containerPort: 6379}]
          readinessProbe: {tcpSocket: {port: rediss}, periodSeconds: 5}
          resources: {requests: {cpu: 250m, memory: 256Mi}, limits: {cpu: "2", memory: 2Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/layerx, readOnly: true}
            - {name: tls, mountPath: /run/layerx/tls, readOnly: true}
            - {name: auth, mountPath: /run/layerx/auth, readOnly: true}
      volumes:
        - {name: config, configMap: {name: layerx-gateway-redis-config}}
        - {name: tls, secret: {secretName: layerx-gateway-redis-tls}}
        - {name: auth, secret: {secretName: layerx-gateway-redis-auth}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-gateway-redis, namespace: layerx-mainnet-beta}
spec: {clusterIP: None, selector: {app: layerx-gateway-redis}, ports: [{name: rediss, port: 6379, targetPort: rediss}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: layerx-gateway, namespace: layerx-mainnet-beta}
spec:
  replicas: 3
  selector: {matchLabels: {app: layerx-gateway}}
  template:
    metadata: {labels: {app: layerx-gateway, layerx-plane: public}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 4020, runAsGroup: 4020, fsGroup: 4020}
      containers:
        - name: gateway
          image: ghcr.io/sidiora-labs/layerx-gateway:0.1.0
          imagePullPolicy: Always
          ports: [{name: https, containerPort: 9443}]
          env:
            - {name: LAYERX_EVENTS_PAYMENT_UPSTREAM_URL, value: "https://payments.layerx-internal.svc"}
            - {name: LAYERX_EVENTS_PAYMENT_UPSTREAM_CA_DER, value: "/run/layerx/events/ca.der"}
            - {name: LAYERX_EVENTS_PAYMENT_UPSTREAM_TOKEN_FILE, value: "/run/layerx/events/token"}
            - {name: LAYERX_EVENTS_PAYMENT_UPSTREAM_CLIENT_IDENTITY_PKCS12, value: "/run/layerx/events/client.p12"}
            - {name: LAYERX_EVENTS_PAYMENT_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE, value: "/run/layerx/events/password"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_URL, value: "https://layerx-webhooks.layerx-developer.svc"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CA_DER, value: "/run/layerx/events/ca.der"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_TOKEN_FILE, value: "/run/layerx/events/webhook-token"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PKCS12, value: "/run/layerx/events/client.p12"}
            - {name: LAYERX_EVENTS_WEBHOOKS_UPSTREAM_CLIENT_IDENTITY_PASSWORD_FILE, value: "/run/layerx/events/password"}
            - {name: LAYERX_GATEWAY_LISTEN, value: "0.0.0.0:9443"}
            - {name: LAYERX_GATEWAY_TLS_CERT_DER, value: /run/layerx/server/server.crt.der}
            - {name: LAYERX_GATEWAY_TLS_KEY_DER, value: /run/layerx/server/server.key.der}
            - {name: LAYERX_GATEWAY_OUTBOUND_CA_DER, value: /run/layerx/trust/ca.crt.der}
            - {name: LAYERX_GATEWAY_SERVICE_CLIENT_IDENTITY_PKCS12, value: /run/layerx/client/client.p12}
            - {name: LAYERX_GATEWAY_SERVICE_CLIENT_IDENTITY_PASSWORD_FILE, value: /run/layerx/client/password}
            # Operator supplies faucet-url and redis-url in ConfigMap layerx-gateway-upstreams.
            - name: LAYERX_GATEWAY_FAUCET_URL
              valueFrom:
                configMapKeyRef:
                  name: layerx-gateway-upstreams
                  key: faucet-url
                  optional: false
            - {name: LAYERX_GATEWAY_FAUCET_SERVICE_TOKEN_FILE, value: /run/layerx/faucet/token}
            - {name: LAYERX_GATEWAY_FAUCET_CLAIM_AMOUNT, value: "1000000"}
            - name: LAYERX_GATEWAY_PAXEER_RPC_URLS
              value: >-
                ["https://api1.mainnet-beta.paxeer.network/",
                 "https://api2.mainnet-beta.paxeer.network/",
                 "https://api3.mainnet-beta.paxeer.network/",
                 "https://api4.mainnet-beta.paxeer.network/",
                 "https://api5.mainnet-beta.paxeer.network/",
                 "https://api6.mainnet-beta.paxeer.network/",
                 "https://api7.mainnet-beta.paxeer.network/",
                 "https://api8.mainnet-beta.paxeer.network/"]
            - name: LAYERX_GATEWAY_REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: layerx-gateway-upstreams
                  key: redis-url
                  optional: false
            - {name: LAYERX_GATEWAY_REDIS_USERNAME_FILE, value: /run/layerx/redis/username}
            - {name: LAYERX_GATEWAY_REDIS_PASSWORD_FILE, value: /run/layerx/redis/password}
            - {name: LAYERX_GATEWAY_RECEIPT_KEYS_FILE, value: /run/layerx/receipt-keys/receipt-keys.json}
            - {name: LAYERX_GATEWAY_NETWORK_ID, value: paxeer-mainnet-beta}
            - {name: LAYERX_GATEWAY_LXP_WIRE_VERSION, value: "3"}
            - {name: LAYERX_GATEWAY_PROTOCOL_NETWORK_ID, value: "125"}
            - {name: LAYERX_GATEWAY_IDEMPOTENCY_SECONDS, value: "604800"}
          readinessProbe: {httpGet: {scheme: HTTPS, path: /readyz, port: https}, periodSeconds: 5, failureThreshold: 3}
          livenessProbe: {httpGet: {scheme: HTTPS, path: /livez, port: https}, periodSeconds: 15}
          resources: {requests: {cpu: 500m, memory: 256Mi}, limits: {cpu: "2", memory: 1Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: events, mountPath: /run/layerx/events, readOnly: true}
            - {name: server, mountPath: /run/layerx/server, readOnly: true}
            - {name: trust, mountPath: /run/layerx/trust, readOnly: true}
            - {name: receipt-keys, mountPath: /run/layerx/receipt-keys, readOnly: true}
            - {name: client, mountPath: /run/layerx/client, readOnly: true}
            - {name: faucet, mountPath: /run/layerx/faucet, readOnly: true}
            - {name: redis, mountPath: /run/layerx/redis, readOnly: true}
      volumes:
        - {name: events, secret: {secretName: layerx-gateway-event-producer, defaultMode: 0440}}
        - {name: server, secret: {secretName: layerx-gateway-server-tls}}
        - {name: trust, secret: {secretName: layerx-internal-ca}}
        - name: receipt-keys
          secret:
            secretName: layerx-gateway-receipt-keys
            optional: false
            defaultMode: 0440
            items: [{key: receipt-keys.json, path: receipt-keys.json}]
        - {name: client, secret: {secretName: layerx-gateway-client-identity}}
        - {name: faucet, secret: {secretName: layerx-gateway-faucet-client}}
        - {name: redis, secret: {secretName: layerx-gateway-redis-client}}
---
apiVersion: v1
kind: Service
metadata: {name: layerx-gateway, namespace: layerx-mainnet-beta}
spec: {selector: {app: layerx-gateway}, ports: [{name: https, port: 443, targetPort: https}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: layerx-gateway, namespace: layerx-mainnet-beta}
spec: {minAvailable: 2, selector: {matchLabels: {app: layerx-gateway}}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: layerx-gateway, namespace: layerx-mainnet-beta}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: layerx-gateway}
  minReplicas: 3
  maxReplicas: 30
  behavior: {scaleDown: {stabilizationWindowSeconds: 300}}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-gateway-redis, namespace: layerx-mainnet-beta}
spec:
  podSelector: {matchLabels: {app: layerx-gateway-redis}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app: layerx-gateway}}}]
      ports: [{protocol: TCP, port: 6379}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-developer}}
          podSelector: {matchLabels: {app: layerx-dashboard-api}}
      ports: [{protocol: TCP, port: 6379}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-gateway, namespace: layerx-mainnet-beta}
spec:
  podSelector: {matchLabels: {app: layerx-gateway}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ingress-nginx}}
        - namespaceSelector: {matchLabels: {layerx-control-plane: enabled}}
          podSelector: {matchLabels: {layerx-plane: control}}
      ports: [{protocol: TCP, port: 9443}]
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-internal}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [layerx-internal-payments, layerx-internal-programs]}]}
      ports: [{protocol: TCP, port: 9443}]
    - from:
        - podSelector: {matchLabels: {app: layerx-node}}
        - namespaceSelector: {matchLabels: {layerx.io/gateway-peer-namespace: "true"}}
          podSelector: {matchLabels: {app: layerx-program-registry}}
      ports: [{protocol: TCP, port: 9443}]
  egress:
    - to: [{podSelector: {matchLabels: {app: layerx-gateway-redis}}}]
      ports: [{protocol: TCP, port: 6379}]
    # Public node roots use HTTPS outside the cluster.
    - to: [{ipBlock: {cidr: 0.0.0.0/0}}]
      ports: [{protocol: TCP, port: 443}]
    - to:
        - namespaceSelector: {matchLabels: {layerx.io/gateway-peer-namespace: "true"}}
          podSelector: {matchLabels: {app: layerx-program-registry}}
      ports: [{protocol: TCP, port: 9420}]
    - to:
        - namespaceSelector: {matchLabels: {layerx.io/gateway-peer-namespace: "true"}}
          podSelector: {matchLabels: {layerx-plane: trusted-boundary}}
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 9445}, {protocol: TCP, port: 9446}]
    - to:
        - namespaceSelector: {matchLabels: {layerx.io/gateway-peer-namespace: "true"}}
          podSelector: {matchLabels: {app: layerx-faucet}}
      ports: [{protocol: TCP, port: 9443}]
    - to: [{namespaceSelector: {}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: layerx-gateway
  namespace: layerx-mainnet-beta
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-body-size: 512k
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "10"
spec:
  ingressClassName: nginx
  tls: [{hosts: [api-mainnet-beta.paxeer.network], secretName: layerx-gateway-ingress-tls}]
  rules:
    - host: api-mainnet-beta.paxeer.network
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: {service: {name: layerx-gateway, port: {name: https}}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-gateway-event-producer, namespace: layerx-mainnet-beta}
spec:
  podSelector: {matchLabels: {app: layerx-gateway}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-internal}}
          podSelector: {matchExpressions: [{key: app, operator: In, values: [layerx-internal-payments]} ]}
      ports: [{protocol: TCP, port: 9443}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-developer}}
          podSelector: {matchLabels: {app: layerx-webhooks}}
      ports: [{protocol: TCP, port: 9444}]
