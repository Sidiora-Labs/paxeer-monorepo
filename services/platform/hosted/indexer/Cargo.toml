[package]
name = "layerx-indexer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "layerx-indexer"
path = "src/main.rs"

[[bin]]
name = "layerx-ai-source"
path = "src/bin/ai_source.rs"

[[test]]
name = "store_writers"
path = "tests/store_writers.rs"

[dependencies]
layerx-committed-proof = { path = "../../../../services/interop/crates/layerx-committed-proof" }
layerx-platform-internal.workspace = true
layerx-types.workspace = true
layerx-wire.workspace = true
layerx-programs-ai-market = { path = "../../../../programs/crates/layerx-programs-ai-market" }
postgres = "=0.19.14"
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "fallible_uint"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3 = "=0.10.8"
tokio-postgres-rustls = { version = "=0.14.0", features = ["ring"] }

[dev-dependencies]
ed25519-dalek.workspace = true
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
layerx-crypto = { path = "../../../../services/agent/crates/layerx-crypto" }

[lints]
workspace = true
