apiVersion: apps/v1
kind: StatefulSet
metadata: {name: paxeer, namespace: layerx-testnet}
spec:
  serviceName: paxeer
  replicas: 1
  selector: {matchLabels: {app: paxeer}}
  template:
    metadata: {labels: {app: paxeer, layerx-plane: trusted-boundary}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 4020, runAsGroup: 4020, fsGroup: 4020}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: genesis
          image: ghcr.io/sidiora-labs/kernel:0.1.0
          imagePullPolicy: Always
          command: [python3, -c]
          args:
            - |
              import hashlib, json, os
              from pathlib import Path
              source = Path('/run/native-inputs')
              home = Path('/data/layerx/node')
              manifest = json.loads((source / 'manifest.json').read_bytes())
              assert manifest['schema'] == 'layerx.beta.native-material.v1'
              assert manifest['chain_id'] == 'hyperpax_125-1' and manifest['evm_chain_id'] == 125
              paths = {'genesis.json': 'config/genesis.json', 'config.toml': 'config/config.toml',
                       'app.toml': 'config/app.toml', 'priv_validator_key.json': 'config/priv_validator_key.json',
                       'node_key.json': 'config/node_key.json', 'receipt.key': 'config/receipt.key',
                       'priv_validator_state.json': 'data/priv_validator_state.json',
                       'treasury-policy.json': 'treasury-policy.json', 'receipt-keys.json': 'receipt-keys.json'}
              assert set(manifest['files']) == set(paths)
              retained = home / '.native-material.json'
              raw = (source / 'manifest.json').read_bytes()
              for name in paths:
                  assert hashlib.sha256((source / name).read_bytes()).hexdigest() == manifest['files'][name]
              if retained.exists():
                  assert retained.read_bytes() == raw, 'retained native chain or treasury policy changed'
                  for name, relative in paths.items():
                      target = home / relative
                      assert target.is_file() and not target.is_symlink()
                      if name != 'priv_validator_state.json':
                          assert hashlib.sha256(target.read_bytes()).hexdigest() == manifest['files'][name]
              else:
                  assert not home.exists(), 'refusing partial or retired node state'
                  home.mkdir(parents=True, mode=0o700)
                  for directory in ('config', 'data'):
                      (home / directory).mkdir(mode=0o700)
                  for name, relative in paths.items():
                      with (home / relative).open('xb') as output:
                          os.chmod(output.name, 0o600)
                          output.write((source / name).read_bytes())
                          output.flush()
                          os.fsync(output.fileno())
                  with retained.open('xb') as output:
                      os.chmod(output.name, 0o600)
                      output.write(raw)
                      output.flush()
                      os.fsync(output.fileno())
                  for directory in ('config', 'data', '.'):
                      fd = os.open(home / directory, os.O_RDONLY | os.O_DIRECTORY)
                      os.fsync(fd)
                      os.close(fd)
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 10m, memory: 32Mi}, limits: {cpu: 100m, memory: 256Mi}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: native-inputs, mountPath: /run/native-inputs, readOnly: true}
      containers:
        - name: paxd
          image: ghcr.io/sidiora-labs/kernel:0.1.0
          imagePullPolicy: Always
          command: [python3, /opt/layerx/kernel_runtime.py, --home, /data/layerx/node]
          env:
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: LAYERX_KERNEL_PROFILE, value: native}
            - {name: LAYERX_NODE_NETWORK_ID, valueFrom: {configMapKeyRef: {name: layerx-node-config, key: network-id}}}
          ports: [{name: p2p, containerPort: 26656}, {name: rpc, containerPort: 8545}, {name: consensus, containerPort: 26657}, {name: health, containerPort: 9460}]
          readinessProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5, timeoutSeconds: 10}
          startupProbe: {httpGet: {path: /readyz, port: health}, periodSeconds: 5, timeoutSeconds: 10, failureThreshold: 60}
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "4", memory: 8Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
        - name: boundary
          image: ghcr.io/sidiora-labs/layerx-paxeer-boundary:0.1.0
          imagePullPolicy: Always
          command: [sh, -ec]
          args:
            - |
              LAYERX_PAXEER_BOUNDARY_LISTEN=0.0.0.0:9444 /usr/local/bin/layerx-paxeer-boundary &
              observer=$!
              /usr/local/bin/layerx-paxeer-boundary &
              primary=$!
              trap 'kill "$primary" "$observer" 2>/dev/null; wait' EXIT
              trap 'exit 0' TERM INT
              wait -n "$primary" "$observer"
              exit 1
          env:
            - {name: LAYERX_PAXEER_BOUNDARY_LISTEN, value: "0.0.0.0:9443"}
            - {name: LAYERX_PAXEER_NODE_URL, value: "http://127.0.0.1:8545"}
            - {name: LAYERX_PAXEER_COMET_URL, value: "http://127.0.0.1:26657"}
            - {name: LAYERX_PAXEER_CHAIN_ID, value: "125"}
            - {name: LAYERX_PAXEER_BOUNDARY_TLS_CERT_DER, value: /run/layerx/tls/server.crt.der}
            - {name: LAYERX_PAXEER_BOUNDARY_TLS_KEY_DER, value: /run/layerx/tls/server.key.der}
          ports: [{name: https, containerPort: 9443}, {name: observer-https, containerPort: 9444}]
          readinessProbe: {httpGet: {path: /readyz, port: https, scheme: HTTPS}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /livez, port: https, scheme: HTTPS}, periodSeconds: 10}
          resources: {requests: {cpu: 100m, memory: 64Mi}, limits: {cpu: "1", memory: 512Mi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: tls, mountPath: /run/layerx/tls, readOnly: true}
      volumes:
        - {name: tls, secret: {secretName: paxeer-boundary-tls}}
        - {name: native-inputs, secret: {secretName: layerx-native-inputs, defaultMode: 0440}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 40Gi}}}
---
apiVersion: v1
kind: Service
metadata: {name: paxeer, namespace: layerx-testnet}
spec: {clusterIP: None, selector: {app: paxeer}, ports: [{name: https, port: 9443, targetPort: https}]}
---
apiVersion: v1
kind: Service
metadata: {name: paxeer-boundary, namespace: layerx-testnet}
spec: {selector: {app: paxeer}, ports: [{name: https, port: 9443, targetPort: https}]}
---
apiVersion: v1
kind: Service
metadata: {name: paxeer-observer-boundary, namespace: layerx-testnet}
spec: {selector: {app: paxeer}, ports: [{name: https, port: 9443, targetPort: observer-https}]}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: paxeer-boundary, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: paxeer}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: layerx-testnet-control}}
        - podSelector: {matchLabels: {app: layerx-node}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: layerx-mainnet-beta}}
          podSelector: {matchLabels: {app: layerx-gateway}}
        - namespaceSelector: {}
          podSelector: {matchLabels: {layerx-plane: human}}
      ports: [{protocol: TCP, port: 9443}, {protocol: TCP, port: 9444}]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: layerx-node-egress, namespace: layerx-testnet}
spec:
  podSelector: {matchLabels: {app: layerx-node}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app: paxeer}}}]
      ports: [{protocol: TCP, port: 9443}]
    - to: [{podSelector: {matchLabels: {app: paxeer}}}]
      ports: [{protocol: TCP, port: 9444}]
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
