name: Security

on:
  push:
    branches: [main]
    paths:
      - "services/platform/perf-db/**"
      - ".github/workflows/perf-db-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/platform/perf-db/**"
      - ".github/workflows/perf-db-security.yml"
  schedule:
    - cron: "0 6 * * 1"

defaults:
  run:
    working-directory: services/platform/perf-db

jobs:
  audit:
    name: cargo-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: services/platform/perf-db/Cargo.toml
