# Deployment template: render with python3 services/interop/deploy/x-websearch/render_deploy_template.py <this-file>
# to an operator-owned file, then deploy that file with --config and --image.
# Every ${NAME} is required from the environment; no provider defaults.
app = "paxeer-xweb-attestor-2"
primary_region = "ams"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "../../../../docker/x-websearch/Dockerfile"
  build-target = "fly"

[deploy]
  strategy = "immediate"

[env]
  X_WEBSEARCH_ATTESTOR_KEY_FILE = "/data/keys/attestor.key"
  X_WEBSEARCH_SUBMITTER_KEY_FILE = "/data/keys/submitter.key"
  X_WEBSEARCH_RECEIVER_KEY_FILE = "/data/keys/receiver.key"
  XWEB_HOPS = "8491=${XWEB_ATTESTOR_1_HOST} 8493=${XWEB_ATTESTOR_3_HOST} 8494=${XWEB_ATTESTOR_4_HOST}"

[[mounts]]
  source = "xweb_attestor_2_data"
  destination = "/data"
  initial_size = "1gb"
  scheduled_snapshots = true
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
  cpu_kind = "shared"
