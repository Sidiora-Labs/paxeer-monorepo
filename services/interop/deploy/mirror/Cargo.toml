[package]
name = "mirror-deployment-repair-22-31-233"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Sidiora Labs"]

[workspace]

[[bin]]
name = "repair-driver"
path = "tests/repair_22_31_233/driver.rs"

[[bin]]
name = "layerx-mirror-verify"
path = "../../crates/layerx-mirror/src/bin/layerx-mirror-verify.rs"

[dependencies]
layerx-mirror = { path = "../../crates/layerx-mirror" }
layerx-proof = { path = "../../../agent/crates/layerx-proof" }
layerx-wire = { path = "../../../agent/crates/layerx-wire" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
sha3 = "=0.10.8"
base64 = "=0.23.1"
bincode = "=1.3.3"
ethabi = "=18.0.0"
solana-loader-v3-interface = { version = "=3.0.0", features = ["serde"] }
solana-pubkey = "=2.4.0"
