[package]
license = "Apache-2.0"
authors = ["Sidiora Labs"]
name = "repair138-producer"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"

[workspace]

[[bin]]
name = "repair138-producer"
path = "main.rs"

[dependencies]
layerx-types = { path = "../../../../../services/agent/crates/layerx-types" }
layerx-client = { path = "../../../../../services/agent/crates/layerx-client" }
layerx-identity-binding = { path = "../../../../../services/agent/crates/layerx-identity-binding" }
layerx-agent-api = { path = "../../../../../services/agent/crates/layerx-agent-api" }
layerx-crypto = { path = "../../../../../services/agent/crates/layerx-crypto" }
layerx-proof = { path = "../../../../../services/agent/crates/layerx-proof" }
layerx-wire = { path = "../../../../../services/agent/crates/layerx-wire" }
layerx-intents = { path = "../../../../../services/human/crates/layerx-intents" }
layerx-programs = { package = "layerx-programs-registry", path = "../../../../../programs/crates/layerx-programs-registry" }
layerx-programs-runtime = { path = "../../../../../programs/crates/layerx-programs-runtime" }
sha2 = "=0.10.9"
serde_json = "=1.0.151"
serde = { version = "=1.0.229", features = ["derive"] }
ureq = { version = "=3.4.0", default-features = false, features = ["json", "rustls-no-provider", "_ring"] }
rustls-native-certs = "=0.8.4"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "=0.103.15", default-features = false, features = ["std"] }
rustix = { version = "=1.1.4", features = ["net"] }
zeroize = "=1.9.0"
getrandom = "=0.3.4"

layerx-platform-gateway = { path = "../../../../../services/platform/hosted/gateway" }
native-tls = "=0.2.18"
