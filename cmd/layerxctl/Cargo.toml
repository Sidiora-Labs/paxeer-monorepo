[package]
name = "layerxctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.91.1"
license = "Apache-2.0"
publish = false

[dependencies]
libc = "0.2"
layerx-client = { path = "../../services/agent/crates/layerx-client" }
layerx-types = { path = "../../services/agent/crates/layerx-types" }
layerx-proof = { path = "../../services/agent/crates/layerx-proof" }
layerx-crypto = { path = "../../services/agent/crates/layerx-crypto" }

[dev-dependencies]
ed25519-dalek = "=2.2.0"
layerx-wire = { path = "../../services/agent/crates/layerx-wire" }

[workspace]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
