<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capture readiness</title>
<link rel="icon" href="data:,">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: white; color: black; font: 16px/1.5 sans-serif; }
  main { padding: 16px; }
  #panel { display: block; width: 200px; height: 80px; background: blue; }
  button { margin-top: 16px; font: inherit; color: black; background: white; border: 2px solid black; min-width: 64px; min-height: 48px; }
  :focus-visible { outline: 3px solid blue; outline-offset: 2px; }
</style>
<body>
<main>
  <svg id="panel" role="img" aria-label="Panel"><rect width="100%" height="100%" fill="none" stroke="black"/></svg>
  <button id="control">Capture</button>
</main>
<script>
  const parameters = new URLSearchParams(location.search);
  if (parameters.has("wide")) document.querySelector("main").style.width = "calc(100vw + 100px)";
  function loadCaptureFont() {
    const font = new FontFace("Capture", "url(/capture-font.woff2)");
    document.fonts.add(font);
    font.load();
  }
  if (parameters.get("capture") === "viewport") {
    document.querySelector("main").style.height = `${innerHeight * 2}px`;
    addEventListener("scroll", loadCaptureFont, { once: true });
  } else {
    let tabs = 0;
    document.addEventListener("keydown", (event) => {
      if (event.key === "Tab" && ++tabs === 3) loadCaptureFont();
    });
  }
</script>
</body>
</html>
