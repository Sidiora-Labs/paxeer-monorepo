rule_files:
  - rules.yml

evaluation_interval: 15s

tests:
  - interval: 15s
    input_series:
      - series: 'cometbft_consensus_height{job="cometbft",host="v1"}'
        values: '100 101 102 103 103 103 103 103 103'
      - series: 'cometbft_p2p_peers{job="cometbft",host="v1"}'
        values: '3x12'
      - series: 'cometbft_consensus_validator_missed_blocks{job="cometbft",host="v1",validator_address="AA"}'
        values: '0 0 0 2 2 2 2 2 2'
    alert_rule_test:
      - eval_time: 30s
        alertname: ChainHeightStalled
        exp_alerts: []
      - eval_time: 2m
        alertname: ChainHeightStalled
        exp_alerts:
          - exp_labels: {severity: critical, job: cometbft, host: v1}
            exp_annotations:
              summary: "v1 block height has not advanced for 60 s"
      - eval_time: 1m
        alertname: ValidatorMissedBlocks
        exp_alerts:
          - exp_labels: {severity: warning, job: cometbft, host: v1, validator_address: AA}
            exp_annotations:
              summary: "validator AA missed blocks in the last 5 m (seen by v1)"
      - eval_time: 3m
        alertname: LowPeerCount
        exp_alerts:
          - exp_labels: {severity: warning, job: cometbft, host: v1}
            exp_annotations:
              summary: "v1 has 3 peers (below 5)"

  - interval: 1m
    input_series:
      - series: 'node_filesystem_avail_bytes{job="node",host="f1",mountpoint="/",fstype="ext4"}'
        values: '10x10'
      - series: 'node_filesystem_size_bytes{job="node",host="f1",mountpoint="/",fstype="ext4"}'
        values: '100x10'
      - series: 'probe_success{__target__="node-readyz:0"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 6m
        alertname: DiskAbove85Percent
        exp_alerts:
          - exp_labels: {severity: warning, job: node, host: f1, mountpoint: /, fstype: ext4}
            exp_annotations:
              summary: "f1 / is 90 percent full"
      - eval_time: 2m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels: {severity: critical, __target__: "node-readyz:0"}
            exp_annotations:
              summary: "node consensus readiness @instance@ is failing"

  - interval: 15s
    input_series:
      - series: 'probe_success{__target__="node-health:0"}'
        values: '0x8 1x3'
      - series: 'probe_success{__target__="node-readyz:0"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: NodeRPCDown
        exp_alerts: []
      - eval_time: 2m
        alertname: NodeRPCDown
        exp_alerts:
          - exp_labels: {severity: critical, __target__: "node-health:0"}
            exp_annotations:
              summary: "node RPC health @instance@ is failing"
      - eval_time: 2m15s
        alertname: NodeRPCDown
        exp_alerts: []
      - eval_time: 2m
        alertname: NodeNotReady
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{__target__="node-readyz:0"}'
        values: '0x8 1x3'
      - series: 'up{__target__="node-health:0"}'
        values: '1x12'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: NodeReadinessProbeDown
        exp_alerts: []
      - eval_time: 2m
        alertname: NodeReadinessProbeDown
        exp_alerts:
          - exp_labels: {severity: critical, __target__: "node-readyz:0"}
            exp_annotations:
              summary: "node readiness probe @instance@ is failing"
      - eval_time: 2m15s
        alertname: NodeReadinessProbeDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'up{__target__="node-readyz:0"}'
        values: '1x12'
      - series: 'up{__target__="node-health:0"}'
        values: '0x8 1x3'
    alert_rule_test:
      - eval_time: 1m45s
        alertname: NodeReadinessProbeDown
        exp_alerts: []
      - eval_time: 2m
        alertname: NodeReadinessProbeDown
        exp_alerts:
          - exp_labels: {severity: critical, __target__: "node-health:0"}
            exp_annotations:
              summary: "node readiness probe @instance@ is failing"
      - eval_time: 2m15s
        alertname: NodeReadinessProbeDown
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'probe_success{__target__="node-readyz:0"}'
        values: '0x4 1x7'
    alert_rule_test:
      - eval_time: 45s
        alertname: NodeNotReady
        exp_alerts: []
      - eval_time: 1m
        alertname: NodeNotReady
        exp_alerts:
          - exp_labels: {severity: critical, __target__: "node-readyz:0"}
            exp_annotations:
              summary: "node consensus readiness @instance@ is failing"
      - eval_time: 1m15s
        alertname: NodeNotReady
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'order_divergence_total{job="receipt-authority",instance="authority"}'
        values: '10x4 11x24'
      - series: 'order_divergence_total{job="receipt-authority",instance="reset-authority"}'
        values: '10 10 0x27'
    alert_rule_test:
      - eval_time: 1m
        alertname: ReceiptOrderDivergence
        exp_alerts: []
      - eval_time: 1m15s
        alertname: ReceiptOrderDivergence
        exp_alerts:
          - exp_labels: {severity: critical, job: receipt-authority, instance: authority}
            exp_annotations:
              summary: "receipt authority authority observed receipt-order divergence"
      - eval_time: 6m15s
        alertname: ReceiptOrderDivergence
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'gas_station_sponsor_balance{job="gas-station",instance="relayer",sponsor="sponsor-a"}'
        values: '99x2 100x2 101x2'
      - series: 'gas_station_sponsor_floor{job="gas-station",instance="relayer",sponsor="sponsor-a"}'
        values: '100x8'
      - series: 'gas_station_sponsor_balance{job="gas-station",instance="relayer",sponsor="sponsor-b"}'
        values: '50x8'
      - series: 'gas_station_sponsor_floor{job="gas-station",instance="relayer",sponsor="sponsor-b"}'
        values: '50x8'
    alert_rule_test:
      - eval_time: 0s
        alertname: SponsorBalanceBelowFloor
        exp_alerts:
          - exp_labels: {severity: critical, job: gas-station, instance: relayer, sponsor: sponsor-a}
            exp_annotations:
              summary: "sponsor sponsor-a on relayer is below its configured balance floor"
      - eval_time: 45s
        alertname: SponsorBalanceBelowFloor
        exp_alerts: []
      - eval_time: 1m30s
        alertname: SponsorBalanceBelowFloor
        exp_alerts: []

  - interval: 15s
    input_series:
      - series: 'gas_station_rate_age_seconds{job="gas-station",instance="publisher"}'
        values: '269x2 270x2 290x2 0x2'
      - series: 'gas_station_max_rate_age_seconds{job="gas-station",instance="publisher"}'
        values: '300x11'
      - series: 'gas_station_rate_age_seconds{job="gas-station",instance="bounded-publisher"}'
        values: '89x2 90x2 99x2 0x2'
      - series: 'gas_station_max_rate_age_seconds{job="gas-station",instance="bounded-publisher"}'
        values: '100x11'
    alert_rule_test:
      - eval_time: 0s
        alertname: RateAgeNearLimit
        exp_alerts: []
      - eval_time: 45s
        alertname: RateAgeNearLimit
        exp_alerts:
          - exp_labels: {severity: warning, job: gas-station, instance: publisher}
            exp_annotations:
              summary: "published paymaster rate on publisher is at least 90 percent of max_rate_age"
          - exp_labels: {severity: warning, job: gas-station, instance: bounded-publisher}
            exp_annotations:
              summary: "published paymaster rate on bounded-publisher is at least 90 percent of max_rate_age"
      - eval_time: 1m30s
        alertname: RateAgeNearLimit
        exp_alerts:
          - exp_labels: {severity: warning, job: gas-station, instance: publisher}
            exp_annotations:
              summary: "published paymaster rate on publisher is at least 90 percent of max_rate_age"
          - exp_labels: {severity: warning, job: gas-station, instance: bounded-publisher}
            exp_annotations:
              summary: "published paymaster rate on bounded-publisher is at least 90 percent of max_rate_age"
      - eval_time: 2m15s
        alertname: RateAgeNearLimit
        exp_alerts: []
