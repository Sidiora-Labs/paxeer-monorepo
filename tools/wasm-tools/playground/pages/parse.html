<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>wasm-tools parse</title>
    <script type="module" src="parse.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>wasm-tools parse</h1>
    </header>

    <main class="textarea-container">
      <div class="description">
        <p>
          Translate from the WebAssembly text format to binary using
          <a href="https://github.com/bytecodealliance/wasm-tools"
            ><code>wasm-tools parse</code></a
          >. You can go the other direction using
          <a href="print"><code>print</code></a
          >.
        </p>
      </div>
      <section class="editor" aria-labelledby="input-label">
        <div class="input-header">
          <label id="input-label" for="input">wat</label>
        </div>
        <div class="input">
          <textarea
            id="input"
            name="wat"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="none"
            spellcheck="false"
          >
(module
  (import "foo" "bar" (func (param f32)))
  (memory (data "hi"))
  (type (func (param i32) (result i32)))
  (start 1)
  (table 0 1 funcref)
  (func)
  (func (type 1)
    i32.const 42
    drop)
  (export "e" (func 1)))</textarea
          >
        </div>
      </section>
      <section class="editor" aria-labelledby="output-label">
        <div class="output-header">
          <label id="output-label" for="output">wasm</label>
          <button id="download" type="button" disabled>Download</button>
        </div>
        <div class="output">
          <textarea
            id="output"
            name="wasm"
            spellcheck="false"
            aria-live="polite"
          ></textarea>
        </div>
      </section>
    </main>
  </body>
</html>
