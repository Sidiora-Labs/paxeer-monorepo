<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>wasm-tools print</title>
    <script type="module" src="print.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>wasm-tools print</h1>
    </header>

    <div id="overlay" aria-hidden="true">Drop .wasm file here</div>

    <main class="textarea-container">
      <div class="description">
        <p>
          Translate WebAssembly binaries to text format using
          <a href="https://github.com/bytecodealliance/wasm-tools"
            ><code>wasm-tools print</code></a
          >. You can go the other direction using
          <a href="parse"><code>parse</code></a
          >.
        </p>
      </div>

      <section class="editor">
        <div class="output-header">
          Drop a file on this page, or
          <button id="upload" type="button">manually select a file</button>.
          <input
            type="file"
            id="fileInput"
            name="wasm-file"
            accept=".wasm"
            aria-label="WebAssembly binary"
            hidden
          />
        </div>
        <div class="config">
          <input type="checkbox" id="skeleton" name="skeleton" />
          <label for="skeleton"
            >Skip function bodies (recommended for large files)</label
          >
        </div>
        <div class="output-container">
          <pre
            id="output"
            class="iobox"
            role="textbox"
            aria-label="WebAssembly text output"
            aria-multiline="true"
            contenteditable="plaintext-only"
            spellcheck="false"
            tabindex="0"
          ></pre>
        </div>
      </section>
    </main>
  </body>
</html>
