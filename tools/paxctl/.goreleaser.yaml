version: 2
project_name: seictl

before:
  hooks:
    - go run ./internal/release version --expected {{ .Tag }}
    - go mod tidy
    - go generate ./...

builds:
  - id: seictl
    main: .
    binary: seictl
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/sei-protocol/seictl/internal/cliutil.Version={{ .Tag }}
    flags:
      - -trimpath

archives:
  - id: seictl
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    files:
      - README.md
      - LICENSE.md

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - '^chore:'
      - '^style:'
      - 'typo'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: 'Bug Fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: 'Performance Improvements'
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: 'Refactors'
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: Others
      order: 999

release:
  github:
    owner: Paxeer-Network
    name: paxctl
  draft: false
  prerelease: auto
  mode: replace
  header: |
    ## Paxeer seictl {{ .Tag }}

    Native archives support Linux/macOS on amd64 and arm64.
    Download the archive and checksums.txt from this exact release.
    Verify its SHA-256 entry before extracting or installing the executable.
    See README.md for pinned source prerequisites and proxy authentication.

    In the matching pinned monorepo's tools/paxctl directory, verify the
    extracted artifact's real network/node/workflow provenance annotations:

    ```bash
    go run ./internal/release verify --expected {{ .Tag }} --binary /absolute/path/to/seictl
    ```

  footer: |
    ## What's Changed

    **Full Changelog**: https://github.com/Paxeer-Network/paxctl/compare/{{ .PreviousTag }}...{{ .Tag }}

    ---

    ### Checksums

    Verify your download with the checksums in `checksums.txt`.

    ### Support

    - 🐛 [Report Issues](https://github.com/Paxeer-Network/paxctl/issues)

# Announce the release
announce:
  skip: '{{gt .Patch 0}}'

source:
  enabled: true
  name_template: '{{ .ProjectName }}-{{ .Version }}-source'
  format: tar.gz

