name: Paxeer X Network question
description: Ask a non-security question about building, testing, or using this repository.
title: "question: "
labels: [question]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Select the repository path most closely related to this issue.
      options:
        - admin
        - api
        - apps/bridge
        - apps/explorer
        - apps/inference-peer
        - apps/launchpad
        - apps/names
        - apps/perps
        - apps/wallet
        - apps/web
        - cmd
        - consensus
        - contracts
        - core
        - custodyproof
        - daemon
        - deploy
        - docker
        - docs
        - engine
        - include
        - interchain
        - layerxproof
        - migrations
        - modules
        - node
        - precompiles
        - programs
        - rpc
        - scripts
        - sdk
        - services/agent
        - services/bridge
        - services/explorer
        - services/human
        - services/interop
        - services/launchpad
        - services/platform
        - services/wallet
        - spec
        - src
        - storage
        - tests
        - tools
        - utils
        - wasm
        - wasm-runtime
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here. Use the private process in SECURITY.md. Design discussion that is not a defect may belong in GitHub Discussions.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a security report.
          required: true
  - type: textarea
    attributes:
      label: Question
      description: What you need clarified, including the revision and commands you already ran.
    validations:
      required: true
