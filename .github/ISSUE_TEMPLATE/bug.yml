name: Paxeer X Network bug report
description: Report a reproducible, non-security defect.
title: "bug: "
labels: [bug]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Select the repository path most closely related to this issue.
      options:
        - admin
        - api
        - apps/bridge
        - apps/explorer
        - apps/inference-peer
        - apps/launchpad
        - apps/names
        - apps/perps
        - apps/wallet
        - apps/web
        - cmd
        - consensus
        - contracts
        - core
        - custodyproof
        - daemon
        - deploy
        - docker
        - docs
        - engine
        - include
        - interchain
        - layerxproof
        - migrations
        - modules
        - node
        - precompiles
        - programs
        - rpc
        - scripts
        - sdk
        - services/agent
        - services/bridge
        - services/explorer
        - services/human
        - services/interop
        - services/launchpad
        - services/platform
        - services/wallet
        - spec
        - src
        - storage
        - tests
        - tools
        - utils
        - wasm
        - wasm-runtime
    validations:
      required: true
  - type: markdown
    attributes:
      value: Do not disclose vulnerabilities here. Use the private process in SECURITY.md.
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and this is not a security report.
          required: true
  - type: input
    attributes:
      label: Revision
      description: Commit identifying the source tested.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Operating system, architecture, compiler or Foundry version, and relevant tool versions.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Exact commands and the smallest input that reproduces the behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual behavior
      description: Include complete error output with credentials and private infrastructure removed.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Affected behavior
      description: Describe the component behavior or public interface affected.
