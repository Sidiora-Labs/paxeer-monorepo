name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

env:
  LC_ALL: C
  TZ: UTC

jobs:
  tests-python:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native test dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential libssl-dev libsqlite3-dev ripgrep python3-venv
      - name: Install Python test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/tests-python"
          "$RUNNER_TEMP/tests-python/bin/python3" -m pip install pytest cryptography PyYAML
          echo "$RUNNER_TEMP/tests-python/bin" >> "$GITHUB_PATH"
      - name: Run Python repository tests
        run: make test-tests-python

  programs-reference-fixtures:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libssl-dev pkg-config
      - name: Install pinned guest toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build program reference fixtures
        run: make programs-reference-fixtures

  repository-audit:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install audit dependencies
        run: sudo apt-get update && sudo apt-get install --yes golang-go ripgrep
      - name: Audit publication set
        run: make public-audit

  c17:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install native dependencies
        run: >-
          sudo apt-get update && sudo apt-get install --yes
          build-essential clang libssl-dev libsqlite3-dev ripgrep
      - name: Install pinned guest toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --target wasm32-unknown-unknown
      - name: Build and test
        env:
          CC: ${{ matrix.compiler }}
        run: make build test scan-consensus

  solidity:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.7.1
          cache: false
      - name: Install state surface tooling
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check formatting and state surface
        run: forge fmt --check && scripts/ci/solidity-state-surface.sh
      - name: Bootstrap pinned Solidity libraries
        run: bash contracts/bootstrap-libs.sh
      - name: Build contracts
        run: forge build --sizes
      - name: Run contract and invariant suites
        run: forge test -vvv

  loadtest:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: tools/loadtest/go.mod
          cache-dependency-path: tools/loadtest/go.sum
      - name: Build loadtest module
        run: go -C tools/loadtest build ./...
      - name: Test loadtest module
        run: go -C tools/loadtest test -count=1 ./...

  js-suite-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install inventory dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/js-suite-inventory"
          "$RUNNER_TEMP/js-suite-inventory/bin/pip" install pytest PyYAML
      - name: Check JavaScript suite runners and exclusions
        run: >-
          "$RUNNER_TEMP/js-suite-inventory/bin/python" -m pytest -q
          tests/ci/test_js_suites_have_runner.py

  js-node-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: apps/inference-peer
            script: test
          - directory: tools/codebase-map
            script: test:portable
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Run Node.js suite
        working-directory: ${{ matrix.directory }}
        run: npm run ${{ matrix.script }}

  js-npm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        directory: [sdk/js, apps/web, contracts/launchpad]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install package dependencies
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Run package suite
        run: npm test

  js-workspace-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        directory:
          - sdk/integrations/agents
          - sdk/integrations/express
          - sdk/integrations/next
          - sdk/integrations/next/example
          - services/agent/sdk/typescript
          - services/platform/middleware/agent
          - services/platform/middleware/buyer
          - services/platform/middleware/conformance
          - services/platform/middleware/merchant
          - services/platform/middleware/seller
          - services/platform/examples/marketplace
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install workspace dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build suite prerequisites
        run: >-
          node sdk/integrations/build-dependencies.mjs
          "$(node -p 'require("./${{ matrix.directory }}/package.json").name')"
      - name: Run workspace suite
        working-directory: ${{ matrix.directory }}
        run: npm test
      - name: Run payment conformance suite
        if: matrix.directory == 'services/platform/middleware/conformance'
        run: npm run test:payments --workspace @sidiora/layerx-middleware-conformance

  js-pnpm-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        directory: [sdk/names, services/wallet/ceremony/legacy-import]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install pnpm
        run: npm install --global pnpm@10.15.1
      - name: Install package dependencies
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Run package suite
        run: pnpm test

  js-wallet-gateway-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: services/wallet/attestor/go.mod
          cache-dependency-path: services/wallet/attestor/go.sum
      - name: Install local service prerequisites
        run: sudo apt-get update && sudo apt-get install --yes postgresql openssl
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
      - name: Install pnpm
        run: npm install --global pnpm@9.15.9
      - name: Install wallet dependencies
        working-directory: services/wallet
        run: pnpm install --frozen-lockfile
      - name: Run gateway suite
        working-directory: services/wallet/gateway
        env:
          PG_BIN_DIR: /usr/lib/postgresql/16/bin
        run: pnpm test

  js-explorer-env-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/explorer/deploy/tools/envs-validator
    steps:
      - name: Check out source and tags used by the validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '24.22.0'
          package-manager-cache: false
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Install validator dependencies
        run: yarn install --frozen-lockfile
      - name: Run validator suite
        run: yarn test
