name: Wallet Go tests

on:
  pull_request:
    paths:
      - 'services/wallet/attestor/**'
      - 'services/wallet/ceremony/**'
      - 'services/wallet/gateway/**'
      - 'services/wallet/pnpm-lock.yaml'
      - 'services/wallet/pnpm-workspace.yaml'
      - 'services/human/**'
      - 'services/agent/**'
      - 'tools/qualification/paxeer-x/wallet_go_consumers.py'
      - 'services/wallet/schema/attestor-api/**'
      - 'services/wallet/deploy/attestor-policy.json'
      - 'services/wallet/deploy/attestor-kernel-policy.json'
      - 'services/agent/crates/layerx-crypto/**'
      - 'services/agent/crates/layerx-types/**'
      - 'Makefile'
      - 'layerxproof/**'
      - 'go.mod'
      - 'go.sum'
      - 'precompiles/**/abi.json'
      - 'precompiles/perps/abi/abi.json'
      - 'precompiles/common/erc20_abi.json'
      - '.github/workflows/wallet-go-test.yml'
  push:
    branches: [main]
    paths:
      - 'services/wallet/attestor/**'
      - 'services/wallet/ceremony/**'
      - 'services/wallet/gateway/**'
      - 'services/wallet/pnpm-lock.yaml'
      - 'services/wallet/pnpm-workspace.yaml'
      - 'services/human/**'
      - 'services/agent/**'
      - 'tools/qualification/paxeer-x/wallet_go_consumers.py'
      - 'services/wallet/schema/attestor-api/**'
      - 'services/wallet/deploy/attestor-policy.json'
      - 'services/wallet/deploy/attestor-kernel-policy.json'
      - 'services/agent/crates/layerx-crypto/**'
      - 'services/agent/crates/layerx-types/**'
      - 'Makefile'
      - 'layerxproof/**'
      - 'go.mod'
      - 'go.sum'
      - 'precompiles/**/abi.json'
      - 'precompiles/perps/abi/abi.json'
      - 'precompiles/common/erc20_abi.json'
      - '.github/workflows/wallet-go-test.yml'

permissions:
  contents: read

jobs:
  attestor:
    name: Attestor
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: services/wallet/attestor
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/wallet/attestor/go.mod
          cache-dependency-path: services/wallet/attestor/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.9+sha512.f49b5a8ea0fdedb44bb3c0c1d6575092a53c2950d95b7ad15df11f17974877a2de3a01c07e934e9b28ce716e51c09a94962c7306d09be2e1e4b18a8c8762fd32
      - name: Install gateway dependencies
        working-directory: services/wallet/gateway
        run: pnpm install --frozen-lockfile
      - name: Install agent SDK dependencies for the gateway chain fixture
        working-directory: services/agent/sdk/typescript
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Install Rust custody consumer prerequisites
        working-directory: .
        run: |
          rustup toolchain install 1.91.1 --profile minimal
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev pkg-config
      - name: Build Rust custody consumers
        working-directory: .
        env:
          CARGO_BUILD_JOBS: "4"
          CARGO_TARGET_DIR: ${{ runner.temp }}/wallet-rust
          RUSTUP_TOOLCHAIN: 1.91.1
        run: python3 tools/qualification/paxeer-x/wallet_go_consumers.py --output "$RUNNER_TEMP/wallet-rust-consumers"
      - name: Build native attestor library
        working-directory: .
        run: |
          make build/liblayerx.a
          echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/build" >> "$GITHUB_ENV"
      - name: Test attestor (including TestABICopiesMatchRepository)
        env:
          CGO_ENABLED: "1"
          CARGO_BUILD_JOBS: "4"
          CARGO_TARGET_DIR: ${{ runner.temp }}/wallet-rust
          RUSTUP_TOOLCHAIN: 1.91.1
        run: sh ../../../tools/runtime/run-with-clock.sh go test -count=1 ./...

  ceremony:
    name: Ceremony
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: services/wallet/ceremony
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/wallet/ceremony/go.mod
          cache-dependency-path: services/wallet/ceremony/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.9+sha512.f49b5a8ea0fdedb44bb3c0c1d6575092a53c2950d95b7ad15df11f17974877a2de3a01c07e934e9b28ce716e51c09a94962c7306d09be2e1e4b18a8c8762fd32
      - name: Install gateway dependencies
        working-directory: services/wallet/gateway
        run: pnpm install --frozen-lockfile
      - name: Install agent SDK dependencies for the gateway chain fixture
        working-directory: services/agent/sdk/typescript
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Install PostgreSQL fixture binaries
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends postgresql
          echo "PG_BIN_DIR=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)" >> "$GITHUB_ENV"
      - name: Test ceremony
        run: go test ./...
