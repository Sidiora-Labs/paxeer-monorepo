name: Paxeer / Release Publish

on:
  push:
    tags:
      - 'paxeer-network/v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing paxeer-network/vX.Y.Z tag to publish
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  releaser:
    permissions:
      contents: write
    name: Build and publish Paxeer release
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
      - name: Validate tag against tools/release/version.json
        run: |
          set -euo pipefail
          version=$(jq -er '.version' tools/release/version.json)
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid Paxeer semantic version: $version"
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "paxeer-network/$version" ]]; then
            echo "Tag $RELEASE_TAG does not match tools/release/version.json $version"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native build dependencies
        uses: ./.github/actions/release-toolchain
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Build release binaries
        run: tools/release/build-paxd.sh
      - name: Generate release notes
        run: |
          set -euo pipefail
          python3 -m pip install --user git-cliff==2.8.0
          git-cliff --config .github/cliff.toml --tag-pattern '^paxeer-network/v[0-9]' --current --strip header \
            --output "$RUNNER_TEMP/release-notes.md"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#paxeer-network/}
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Paxeer X Network $version" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            "dist/$RELEASE_TAG"/*
          {
            echo "### Paxeer X Network release $RELEASE_TAG"
            echo '```'
            cat "dist/$RELEASE_TAG/SHA256SUMS"
            echo '```'
            echo "$(gh release view "$RELEASE_TAG" --json url --jq '.url')"
          } >> "$GITHUB_STEP_SUMMARY"
