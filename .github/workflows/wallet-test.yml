name: Wallet tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wallet-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vitest:
    name: Vitest (${{ matrix.directory }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        directory: [apps/wallet, sdk/wallet]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 22
      - name: Install pnpm
        run: npm install --global pnpm@10.34.9
      - name: Install agent SDK dependencies
        working-directory: services/agent/sdk/typescript
        run: npm ci --workspaces=false --no-audit --no-fund
      - name: Build agent SDK
        working-directory: services/agent/sdk/typescript
        run: npm run build --workspaces=false
      - name: Install wallet SDK dependencies
        working-directory: sdk/wallet
        run: pnpm install --ignore-workspace --frozen-lockfile
      - name: Install wallet app dependencies
        if: matrix.directory == 'apps/wallet'
        working-directory: apps/wallet
        run: pnpm install --frozen-lockfile
      - name: Run Vitest suite
        working-directory: ${{ matrix.directory }}
        run: pnpm exec vitest run
