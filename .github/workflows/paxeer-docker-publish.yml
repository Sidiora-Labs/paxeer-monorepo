name: Paxeer / Create and Push Docker Image

on:
  workflow_run:
    workflows: ['Paxeer / Release Publish']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:
  pax-images:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: write
    steps:
      -
        name: Check out the repo
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      -
        name: Login Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image namespace
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          echo "IMAGE_NAME=ghcr.io/${REPOSITORY_OWNER,,}/pax" >> "$GITHUB_ENV"
      -
        name: Parse tag
        id: tag
        run: |
          set -euo pipefail
          release_version=$(jq -er '.version' tools/release/version.json)
          RELEASE_TAG="paxeer-network/$release_version"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          VERSION=${RELEASE_TAG#paxeer-network/v}
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          MAJOR_VERSION=$(echo $VERSION | cut -d '.' -f 1)
          MINOR_VERSION=$(echo $VERSION | cut -d '.' -f 2)
          PATCH_VERSION=$(echo $VERSION | cut -d '.' -f 3)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "RELEASE_TAG=$RELEASE_TAG" >> $GITHUB_ENV
          echo "MAJOR_VERSION=$MAJOR_VERSION" >> $GITHUB_ENV
          echo "MINOR_VERSION=$MINOR_VERSION" >> $GITHUB_ENV
          echo "PATCH_VERSION=$PATCH_VERSION" >> $GITHUB_ENV
      - name: Download and verify released paxd and runtime libraries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          asset="paxd-v${VERSION}-linux-amd64"
          assets="$RUNNER_TEMP/paxd-release"
          libraries=(libwasmvm.x86_64.so libwasmvm152.x86_64.so libwasmvm155.x86_64.so)
          gh release download "$RELEASE_TAG" --dir "$assets" \
            --pattern "$asset" --pattern SHA256SUMS \
            --pattern libwasmvm.x86_64.so --pattern libwasmvm152.x86_64.so --pattern libwasmvm155.x86_64.so
          cd "$assets"
          for file in "$asset" "${libraries[@]}"; do
            awk -v file="$file" '$2 == file { print }' SHA256SUMS > "$file.sha256"
            test "$(wc -l < "$file.sha256")" -eq 1
            sha256sum --check --strict "$file.sha256"
          done
          destination="$GITHUB_WORKSPACE/release/linux/amd64"
          mkdir -p "$destination"
          install -m 0755 "$asset" "$destination/paxd"
          install -m 0644 "${libraries[@]}" "$destination/"
      -
        name: Build and push
        id: build_push_image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          file: docker/layerx/Dockerfile
          context: .
          target: release
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.MAJOR_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}
            ${{ env.IMAGE_NAME }}:${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
            ${{ env.IMAGE_NAME }}:v${{ env.MAJOR_VERSION }}.${{ env.MINOR_VERSION }}.${{ env.PATCH_VERSION }}
      - name: Record image digest in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          IMAGE_DIGEST: ${{ steps.build_push_image.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          notes="$RUNNER_TEMP/release-notes.md"
          gh release view "$RELEASE_TAG" --json body --jq '.body' > "$notes"
          printf '\n### Container image\n\n`%s:v%s@%s`\n' "$IMAGE_NAME" "$VERSION" "$IMAGE_DIGEST" >> "$notes"
          gh release edit "$RELEASE_TAG" --notes-file "$notes"
