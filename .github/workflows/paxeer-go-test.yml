name: Paxeer / Go Test
on:
  workflow_call:
  pull_request:
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'tests/ci/test_go_build_tags_wired.py'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'tools/hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'tests/occ/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-go-test.yml'
  merge_group:
  push:
    branches:
      - main
      - release/**
    paths:
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'tests/ci/test_go_build_tags_wired.py'
      - 'docker/layerx/Dockerfile'
      - 'docker/layerx/Dockerfile.dockerignore'
      - 'foundry.paxeer.toml'
      - 'buf.gen.yaml'
      - 'buf.lock'
      - 'buf.yaml'
      - '.github/codecov.yml'
      - '.golangci.yml'
      - 'tools/repotest/gen.go'
      - 'tools/repotest/link_directives_test.go'
      - 'tools/repotest/mod_test.go'
      - 'scripts/run_blocktests.sh'
      - 'tools/release/version.json'
      - 'admin/**'
      - 'api/**'
      - 'tools/benchmark/**'
      - 'consensus/**'
      - 'custodyproof/**'
      - 'daemon/**'
      - 'docker/**'
      - 'engine/**'
      - 'tests/fixtures/example/**'
      - 'tools/hpx/**'
      - 'tests/integration/**'
      - 'interchain/**'
      - 'modules/**'
      - 'node/**'
      - 'tests/occ/**'
      - 'precompiles/**'
      - 'rpc/**'
      - 'sdk/**'
      - 'storage/**'
      - 'tests/testutil/**'
      - 'utils/**'
      - 'wasm/**'
      - 'wasm-runtime/**'
      - 'contracts/src/**'
      - 'contracts/test/**'
      - 'contracts/scripts/**'
      - 'contracts/wasm/**'
      - 'docs/swagger/**'
      - 'docs/swagger-ui/**'
      - 'tests/chain/**'
      - 'tools/chain/**'
      - 'tools/tx-scanner/**'
      - 'tools/utils/**'
      - 'contracts/config/client.toml'
      - 'contracts/hardhat.config.js'
      - 'contracts/package.json'
      - 'contracts/package-lock.json'
      - 'contracts/tsconfig.json'
      - 'docs/evm_jsonrpc_unsupported.md'
      - 'docs/paxeer-network.md'
      - 'docs/paxeer-chain-docs.md'
      - 'scripts/**'
      - '!scripts/qualify-mirror-live.sh'
      - '!scripts/qualify-mirror-verification-live.sh'
      - '.github/workflows/paxeer-go-test.yml'

defaults:
  run:
    working-directory: .

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}

env:
  GO_VERSION: '1.25.8'
  GO_TEST_TIMEOUT: 30m
  # state_db tests run in their own workflow (db-tests.yml); exclude
  # that subtree everywhere in this workflow to avoid double-running them.
  STATE_DB_PKG_PREFIX: github.com/Sidiora-Labs/Paxeer-X-Network/storage/state_db

permissions:
  contents: read

jobs:
  tagged-tests:
    name: Go build tags (${{ matrix.tags }})
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - tags: mock_block_validation
            packages: ./consensus/types/...
          - tags: mock_chain_validation
            packages: ./consensus/types/...
          - tags: libsecp256k1_sdk
            packages: ./sdk/crypto/keys/secp256k1/...
          - tags: release
            packages: ./consensus/rpc/jsonrpc/client/...
          - tags: gofuzz
            packages: ./consensus/test/fuzz/...
    env:
      CGO_ENABLED: '1'
      GOFLAGS: -race -tags=ledger,test_ledger_mock,${{ matrix.tags }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Go test tagged packages and fuzz seed corpora
        run: go test -count=1 -timeout=${{ env.GO_TEST_TIMEOUT }} ${{ matrix.packages }}

  autobahn-integration:
    name: Autobahn integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_PLATFORM: linux/amd64
      GIGA_EXECUTOR: 'true'
      GIGA_STORAGE: 'true'
      GIGA_OCC: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Autobahn integration tests
        run: make -f chain.mk autobahn-integration-test AUTOBAHN_TEST_TIMEOUT=${{ env.GO_TEST_TIMEOUT }}

  hpx-registry:
    name: HPX registry
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/hpx/registry/go.mod
          cache: false
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: '3.12'
      - name: Install workflow test dependencies
        run: python3 -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Check Go test wiring
        run: python3 -m pytest -q tests/ci/test_go_build_tags_wired.py
      - name: Go test registry module
        working-directory: tools/hpx/registry
        env:
          GOWORK: 'off'
        run: go test -count=1 -timeout=${{ env.GO_TEST_TIMEOUT }} ./...

  test:
    name: Race Detection
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -race -tags=ledger,test_ledger_mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download modules
        run: go mod download

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libssl-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Build native libraries
        run: make paxd-native-libs

      - name: Go test
        run: |
          set -euo pipefail
          PKGS=$(go list ./... | grep -v "^${STATE_DB_PKG_PREFIX}")
          echo "$PKGS" | xargs go test \
            -timeout=${{ env.GO_TEST_TIMEOUT }}

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # Skip coverage report for merge groups, since the queue is about safety check. The merge to main will run coverage anyway.
    # GitHub does not support setting "Required" CI workflows for merge queue separately from PRs. If we skip the job at top
    # level we then have to work around result not being present. Hence, the repeated if statements per step.
    env:
      GOFLAGS: -tags=ledger,test_ledger_mock
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Depth 0 for PRs so merge-base diff against the base branch works.
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Check trigger
        if: github.event_name == 'merge_group'
        run: echo 'Coverage skipped in merge queue'

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: github.event_name != 'merge_group'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: github.event_name != 'merge_group' && env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Download modules
        if: github.event_name != 'merge_group'
        run: go mod download

      - name: Install native dependencies
        if: github.event_name != 'merge_group'
        run: sudo apt-get update && sudo apt-get install --yes build-essential libssl-dev

      - name: Install pinned Rust toolchain
        if: github.event_name != 'merge_group'
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Build native libraries
        if: github.event_name != 'merge_group'
        run: make paxd-native-libs

      - name: Determine coverage packages (PR)
        id: cov-pkgs
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          # Use explicit SHAs — works regardless of checkout depth.
          CHANGED=$(git diff --relative --name-only "$BASE_SHA"..."$HEAD_SHA")

          # Keep only existing .go files (filters out deletions).
          CHANGED_GO=$(printf "%s\n" "$CHANGED" \
            | grep -E '\.go$' \
            | while read -r f; do [ -f "$f" ] && echo "$f"; done \
            || true)

          if [[ -z "$CHANGED_GO" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Resolve changed directories to Go packages, then drop the
          # state_db subtree (covered by db-tests.yml) so it neither
          # gets tested nor measured for coverage here.
          DIRECT_PKGS=$(printf "%s\n" "$CHANGED_GO" \
            | xargs -r -n1 dirname \
            | sort -u \
            | while read -r d; do go list "./$d" 2>/dev/null || true; done \
            | sort -u \
            | grep -v "^${STATE_DB_PKG_PREFIX}" || true)

          if [[ -z "$DIRECT_PKGS" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Find one level of reverse dependencies (packages that import
          # the changed packages) so their tests exercise our changes too.
          # Also strip state_db reverse deps; db-tests.yml owns them.
          ALL_IMPORTS=$(go list -f '{{.ImportPath}} {{join .Imports " "}} {{join .TestImports " "}}' ./...)

          REV_DEPS=$(awk '
            NR == FNR { if (NF) targets[$1] = 1; next }
            {
              pkg = $1
              for (i = 2; i <= NF; i++) {
                if ($i in targets) { print pkg; break }
              }
            }
          ' <(printf "%s\n" "$DIRECT_PKGS") <(printf "%s\n" "$ALL_IMPORTS") \
            | sort -u \
            | grep -v "^${STATE_DB_PKG_PREFIX}" || true)

          # Merge direct + reverse-dep packages, deduplicate.
          TEST_PKGS=$(printf "%s\n%s\n" "$DIRECT_PKGS" "$REV_DEPS" \
            | awk 'NF && !seen[$0]++ { printf "%s ", $0 }')
          TEST_PKGS="${TEST_PKGS% }"

          # coverpkg stays as the direct changed packages — we want coverage
          # measured on the code that actually changed, but tested via a wider
          # set of packages (including reverse deps).
          COV_PKGS=$(printf "%s\n" "$DIRECT_PKGS" \
            | awk 'NF { printf "%s%s", sep, $0; sep = "," }')

          echo "test_packages=$TEST_PKGS" >> "$GITHUB_OUTPUT"
          echo "coverpkg=$COV_PKGS" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Go test with coverage (PR fast path)
        if: github.event_name == 'pull_request' && steps.cov-pkgs.outputs.skip != 'true'
        run: |
          go test \
            -timeout=${{ env.GO_TEST_TIMEOUT }} \
            -covermode=atomic \
            -coverprofile=coverage.out \
            -coverpkg=${{ steps.cov-pkgs.outputs.coverpkg }} \
            ${{ steps.cov-pkgs.outputs.test_packages }}

      - name: Go test with coverage (full path)
        if: github.event_name != 'merge_group' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          PKG_LIST=$(go list ./... | grep -v "^${STATE_DB_PKG_PREFIX}")
          PKGS=$(echo "$PKG_LIST" | tr '\n' ' ')
          COVERPKG=$(echo "$PKG_LIST" | paste -sd, -)
          # Pass $PKGS unquoted so go test gets one invocation with N args,
          # not N invocations via xargs (which would each clobber coverage.out).
          go test \
            -timeout=${{ env.GO_TEST_TIMEOUT }} \
            -covermode=atomic \
            -coverprofile=coverage.out \
            -coverpkg="$COVERPKG" \
            $PKGS

      - name: Upload coverage to Codecov
        if: vars.CODECOV_ENABLED == 'true' && github.event_name != 'merge_group' && (github.event_name != 'pull_request' || steps.cov-pkgs.outputs.skip != 'true')
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: 'true'
          # PR fast-path coverage is intentionally partial.
          # Upload under a separate flag to avoid apples-to-oranges project comparisons.
          name: ${{ github.event_name == 'pull_request' && 'pax-chain-pr-coverage' || 'pax-chain-coverage' }}
          files: coverage.out
          flags: ${{ github.event_name == 'pull_request' && 'pax-chain-pr' || 'pax-chain' }}
