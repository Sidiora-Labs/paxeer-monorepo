name: Paxeer / Run Dapp Tests

# Only runs when manually triggered
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: .

permissions:
  contents: read

jobs:
  run-tests-devnet:
    name: Run Tests on Devnet
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    environment:
      name: devnet
    env:
      DAPP_TESTS_MNEMONIC: ${{ secrets.DAPP_TESTS_MNEMONIC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libssl-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Build native libraries
        run: make paxd-native-libs

      - name: Install paxd
        run: |
          # Install paxd using go install
          make -f chain.mk install
          
          # Add the Go bin directory to the PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Dapp Tests Script on Devnet
        run: |
          ./tests/integration/dapp_tests/dapp_tests.sh devnet

  run-tests-testnet:
    name: Run Tests on Testnet
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    environment:
      name: testnet
    env:
      DAPP_TESTS_MNEMONIC: ${{ secrets.DAPP_TESTS_MNEMONIC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes build-essential libssl-dev

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal

      - name: Build native libraries
        run: make paxd-native-libs

      - name: Install paxd
        run: |
          # Install paxd using go install
          make -f chain.mk install
          
          # Add the Go bin directory to the PATH
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Run Dapp Tests Script on Testnet
        run: |
          ./tests/integration/dapp_tests/dapp_tests.sh testnet
