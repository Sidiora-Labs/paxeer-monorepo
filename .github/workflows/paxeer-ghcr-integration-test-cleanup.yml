# Prune integration images using the publisher's integration-registry.json.
# Scheduled runs are dry runs; an explicit dispatch may apply the validated plan.

name: Paxeer / GHCR integration test cleanup

on:
  schedule:
    # Every Sunday, 06:00 UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Log deletions without applying them
        type: boolean
        default: true
      older_than_days:
        description: Delete run-id tags older than this many days
        type: number
        default: 14

concurrency:
  group: ghcr-integration-test-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Prune old integration test images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout registry configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Load integration registry configuration
        run: python3 .github/workflows/scripts/integration_registry.py environment
      - name: Plan and prune stale publisher run-id tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OLDER_THAN_DAYS: ${{ github.event_name == 'workflow_dispatch' && format('{0}', inputs.older_than_days) || '14' }}
          DRY_RUN: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run }}
        run: python3 .github/workflows/scripts/integration_registry.py cleanup
