      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kindle_fixture
          POSTGRES_PASSWORD: kindle_fixture_password
          POSTGRES_DB: kindle_fixture
        ports: ["25432:5432"]
        options: >-
          --health-cmd 'pg_isready -U kindle_fixture -d kindle_fixture' --health-interval 10s
          --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports: ["26379:6379"]
        options: >-
          --health-cmd 'redis-cli ping' --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install and verify the container runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes docker.io acl
          sudo systemctl start docker
          sudo setfacl -m "u:$(id -u):rw" /var/run/docker.sock
          docker version --format '{{.Server.Version}}'
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: |
            sdk/launchpad/**/go.sum
            services/launchpad/**/go.sum
      - name: Set up Node.js for contract and SDK proofs
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Set up Anvil for contract proofs
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: v1.8.1
          cache: false
      - name: Create the pool test database
        env:
          PGPASSWORD: kindle_fixture_password
        run: |
          psql --host 127.0.0.1 --port 25432 --username kindle_fixture --dbname kindle_fixture --command "ALTER ROLE kindle_fixture CREATEDB"
          createdb --host 127.0.0.1 --port 25432 --username kindle_fixture kindle_test
          createdb --host 127.0.0.1 --port 25432 --username kindle_fixture launchpad_notifications
          createdb --host 127.0.0.1 --port 25432 --username kindle_fixture launchpad_pnl
      - name: Start the owned authorization chain
        run: |
          anvil --host 127.0.0.1 --port 28545 --chain-id 125 --threads 2 --silent > "$RUNNER_TEMP/launchpad-anvil.log" 2>&1 &
          for attempt in {1..30}; do
            if cast chain-id --rpc-url "$L34_ANVIL_URL"; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Install fixture binaries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes redis-server
          go install github.com/nats-io/nats-server/v2@v2.11.6
      - name: Start API NATS fixture
        run: |
          nats-server --addr 127.0.0.1 --port 24222 --jetstream --store_dir "$RUNNER_TEMP/launchpad-nats" > "$RUNNER_TEMP/launchpad-nats.log" 2>&1 &
          for attempt in {1..30}; do
            if (echo > /dev/tcp/127.0.0.1/24222) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Start object storage fixture
        run: |
          docker run --detach --name launchpad-minio --publish 9000:9000 \
            --env MINIO_ROOT_USER="$SHARED_TEST_MINIO_ACCESS_KEY_ID" \
            --env MINIO_ROOT_PASSWORD="$SHARED_TEST_MINIO_SECRET_ACCESS_KEY" \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 \
            http://localhost:9000/minio/health/ready
          curl --fail --aws-sigv4 "aws:amz:us-east-1:s3" \
            --user "$SHARED_TEST_MINIO_ACCESS_KEY_ID:$SHARED_TEST_MINIO_SECRET_ACCESS_KEY" \
            --request PUT http://localhost:9000/launchpad-user-test
      - name: Build native library for protocol producer proofs
        working-directory: .
        run: |
          make build/liblayerx.a programs-release-build
          echo "CGO_LDFLAGS=-L${GITHUB_WORKSPACE}/build" >> "$GITHUB_ENV"
      - name: Compile launchpad contracts for API authority proofs
        working-directory: contracts/launchpad
        run: |
          npm install --global "$(node -p 'require("./package.json").packageManager')"
          pnpm install --ignore-workspace --frozen-lockfile
          pnpm compile
      - name: Build protocol proof dependencies
        working-directory: .
        run: |
          set -euo pipefail
          if [ "${{ matrix.module }}" = sdk/launchpad/protocol ]; then
            build_proof_dependencies() {
              (
                cd "$1"
                go list -mod=readonly -deps -test -f '{{if and (not .Standard) (not .ForTest) (ne .Name "main") .GoFiles}}{{.ImportPath}}{{end}}' . > "$RUNNER_TEMP/launchpad-proof-dependencies.txt"
                sed -i '/^$/d' "$RUNNER_TEMP/launchpad-proof-dependencies.txt"
                test -s "$RUNNER_TEMP/launchpad-proof-dependencies.txt"
                xargs go build -mod=readonly < "$RUNNER_TEMP/launchpad-proof-dependencies.txt"
              )
            }
            (
              export GOTOOLCHAIN="go$(awk '$1 == "go" {print $2; exit}' go.mod)"
              build_proof_dependencies precompiles/launchpad
            )
            (
              cd sdk/launchpad/protocol/bindings/testdata/repair37/contracts
              go mod download all
            )
            build_proof_dependencies sdk/launchpad/protocol/bindings/testdata/repair37/contracts
            (
              cd sdk/launchpad/protocol/coverage/testdata/repair28producer
              cp go.mod "$RUNNER_TEMP/launchpad-repair28.mod"
              go build -modfile="$RUNNER_TEMP/launchpad-repair28.mod" -mod=mod -o "$RUNNER_TEMP/launchpad-repair28-producer" .
            )
          fi
      - name: Test Go module
        run: python3 "$GITHUB_WORKSPACE/tests/ci/data/launchpad_go_tests.py" --module .

  launchpad-go-wiring:
    name: Check Go test wiring
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    env:
      GOWORK: "off"
      GOTOOLCHAIN: go1.27.3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go for the real coverage runner check
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache-dependency-path: sdk/launchpad/shared/go.sum
      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v4
        with:
          python-version: "3.12"
      - name: Install wiring test dependencies
        run: python3 -m pip install pytest==8.3.5 PyYAML==6.0.2
      - name: Check Go test wiring
        run: python3 -m pytest -q tests/ci/test_launchpad_go_tests_wired.py
