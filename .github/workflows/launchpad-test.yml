      L17_TEST_DSN: postgres://kindle_fixture:kindle_fixture_password@127.0.0.1:25432/launchpad_pnl?sslmode=disable
      L18_POSTGRES_DSN: postgres://kindle_fixture:kindle_fixture_password@127.0.0.1:25432/launchpad_pnl?sslmode=disable
