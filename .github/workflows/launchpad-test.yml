name: Launchpad / Test

on:
  pull_request:
    paths:
      - sdk/launchpad/**
      - services/launchpad/**
      - tests/ci/data/**
      - services/launchpad/Makefile
      - tests/ci/test_launchpad_go_tests_wired.py
      - apps/launchpad/**
      - .github/workflows/launchpad-test.yml
      - tests/ci/test_launchpad_test_workflow.py
      - tests/ci/test_pnpm_workspace_roots.py
  push:
    branches: [main]
    paths:
      - sdk/launchpad/**
      - services/launchpad/**
      - tests/ci/data/**
      - services/launchpad/Makefile
      - tests/ci/test_launchpad_go_tests_wired.py
      - apps/launchpad/**
      - .github/workflows/launchpad-test.yml
      - tests/ci/test_launchpad_test_workflow.py
      - tests/ci/test_pnpm_workspace_roots.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  launchpad-test:
    name: Test ${{ matrix.package }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk/launchpad/packages/candles-sdk
          - sdk/launchpad/packages/indexer-sdk
          - sdk/launchpad/packages/metadata-sdk
          - sdk/launchpad/packages/production-contracts
          - sdk/launchpad/packages/ranking-algo-sdk
          - sdk/launchpad/packages/sdk
          - sdk/launchpad/packages/sidiora-launchpad-v3
          - sdk/launchpad/packages/stats-sdk
          - sdk/launchpad/packages/users-sdk
          - apps/launchpad/web
          - apps/launchpad/mobile
    defaults:
      run:
        working-directory: apps/launchpad
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Install the workspace package manager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK packages
        run: pnpm run build:packages
      - name: Test package
        working-directory: .
        run: pnpm --dir apps/launchpad --filter "./../../${{ matrix.package }}" --fail-if-no-match run test

  launchpad-go-test:
    name: Go test ${{ matrix.module }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module:
          - sdk/launchpad/shared
          - sdk/launchpad/protocol
          - services/launchpad/api
          - services/launchpad/indexer
          - services/launchpad/pnl-tracker
          - services/launchpad/ranking-algo
          - services/launchpad/stats-workers
          - services/launchpad/trading-charts
          - services/launchpad/gateway
          - services/launchpad/livestream
          - services/launchpad/metadata
          - services/launchpad/social
          - services/launchpad/user
          - services/launchpad/discovery
          - services/launchpad/notifications
          - services/launchpad/security
          - services/launchpad/security/control
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    env:
