name: Launchpad / Test

on:
  pull_request:
    paths:
      - sdk/launchpad/**
      - apps/launchpad/**
      - .github/workflows/launchpad-test.yml
      - tests/ci/test_launchpad_test_workflow.py
  push:
    branches: [main]
    paths:
      - sdk/launchpad/**
      - apps/launchpad/**
      - .github/workflows/launchpad-test.yml
      - tests/ci/test_launchpad_test_workflow.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  launchpad-test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package:
          - sdk/launchpad/packages/candles-sdk
          - sdk/launchpad/packages/indexer-sdk
          - sdk/launchpad/packages/metadata-sdk
          - sdk/launchpad/packages/production-contracts
          - sdk/launchpad/packages/ranking-algo-sdk
          - sdk/launchpad/packages/sdk
          - sdk/launchpad/packages/sidiora-launchpad-v3
          - sdk/launchpad/packages/stats-sdk
          - sdk/launchpad/packages/users-sdk
          - apps/launchpad/web
          - apps/launchpad/mobile
    defaults:
      run:
        working-directory: apps/launchpad
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install the workspace package manager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build SDK packages
        run: pnpm run build:packages
      - name: Test package
        working-directory: ${{ matrix.package }}
        run: pnpm run test
