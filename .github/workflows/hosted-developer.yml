name: hosted-developer-surfaces

on:
  pull_request:
    paths:
      - "services/platform/hosted/webhooks/**"
      - "services/platform/hosted/dashboard/**"
      - ".github/workflows/hosted-developer.yml"
  push:
    branches: [main]
    paths:
      - "services/platform/hosted/webhooks/**"
      - "services/platform/hosted/dashboard/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-boundaries:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # 1.91.1
        with: { toolchain: 1.91.1 }
      - run: cargo test --manifest-path services/platform/Cargo.toml --locked -p layerx-platform-webhooks -p layerx-platform-dashboard
  owner-ui-contract:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with: { node-version: 24.6.0 }
      - run: make developer-dashboard-install developer-dashboard-static-test developer-dashboard-build
  deployment-render:
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-latest' || vars.CI_LINUX_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - run: kubectl apply --dry-run=client -f services/platform/hosted/webhooks/deployment.yaml
