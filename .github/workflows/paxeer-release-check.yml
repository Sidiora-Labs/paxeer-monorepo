name: Paxeer / Release Check

on:
  pull_request:
    paths:
      - 'tools/release/version.json'
      - 'go.mod'
      - 'go.sum'
      - 'chain.mk'
      - 'daemon/**'
      - 'modules/**'
      - 'precompiles/**'
      - 'node/**'
      - 'sdk/**'
      - 'wasm-runtime/**'
      - 'src/**'
      - 'include/**'
      - 'Makefile'
      - 'rust-toolchain.toml'
      - 'programs/**'
      - 'services/platform/Cargo.toml'
      - 'services/platform/Cargo.lock'
      - 'services/platform/hosted/feeder/**'
      - 'tools/price-sidecar/**'
      - 'tools/release/**'
      - 'tools/ci/consensus_commit_gate.py'
      - 'tools/ci/tests/test_consensus_commit_gate.py'
      - 'docs/release/consensus-commits.md'
      - '.github/actions/release-toolchain/**'
      - '.github/workflows/paxeer-release-check.yml'
      - '.github/workflows/paxeer-release-publish.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    name: Validate Paxeer release identity and reproducibility
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    steps:
      - name: Checkout code and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Refuse unlisted consensus-changing commits
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/ci/consensus_commit_gate.py "$PR_BASE_SHA" "$PR_HEAD_SHA"
      - name: Validate version and namespaced tag
        run: |
          set -euo pipefail
          version=$(jq -er '.version' tools/release/version.json)
          semver_re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$version" =~ $semver_re ]]; then
            echo "Invalid Paxeer semantic version: $version"
            exit 1
          fi
          upgrade=$(jq -er '.upgrade' tools/release/version.json)
          if ! grep -hE '^[[:space:]]*const (MergeUpgrade|AnchorStoreDeleteUpgrade|V6120Upgrade)[[:space:]]*=' \
            node/upgrades.go precompiles/common/precompiles.go | grep -qF -- "= \"$upgrade\""; then
            echo "Upgrade name $upgrade is not declared as MergeUpgrade, AnchorStoreDeleteUpgrade or V6120Upgrade in node/upgrades.go or precompiles/common/precompiles.go"
            exit 1
          fi

          tag="paxeer-network/$version"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "Paxeer release tag already exists: $tag"
            exit 1
          fi

          latest=$(git tag --list 'paxeer-network/v*' --sort=-v:refname | head -n 1)
          if [[ -n "$latest" ]]; then
            latest_version=${latest#paxeer-network/}
            greatest=$(printf '%s\n%s\n' "$latest_version" "$version" | sort -V | tail -n 1)
            if [[ "$greatest" != "$version" || "$latest_version" == "$version" ]]; then
              echo "Paxeer version $version must be newer than $latest_version"
              exit 1
            fi
          fi

          echo "Paxeer release identity is $tag (upgrade $upgrade)"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Install native build dependencies
        uses: ./.github/actions/release-toolchain
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.91.1 --profile minimal --no-self-update
      - name: Check reproducible release build
        run: tools/release/reproducible-check.sh
