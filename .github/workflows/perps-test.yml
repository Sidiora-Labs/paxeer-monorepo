name: Perps / Test

on:
  pull_request:
    paths:
      - apps/perps/**
      - tests/ci/data/js_suite_exclusions.txt
      - .github/workflows/perps-test.yml
  push:
    branches: [main]
    paths:
      - apps/perps/**
      - tests/ci/data/js_suite_exclusions.txt
      - .github/workflows/perps-test.yml

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  members:
    name: Test ${{ matrix.package }}
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && 'ubuntu-24.04' || vars.CI_LINUX_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_PERPS_GATEWAY_URL: http://localhost:8080
    strategy:
      fail-fast: false
      matrix:
        package:
          - packages/app
          - packages/cli
          - packages/core
          - packages/i18n
          - packages/net
          - packages/perp
          - packages/plugin-core
          - packages/types
          - packages/ui
          - packages/ui-chain-selector
          - packages/ui-connector
          - packages/ui-scaffold
          - packages/ui-tpsl
          - packages/ui-tradingview
          - packages/utils
          - packages/wallet-connector-privy
    defaults:
      run:
        working-directory: apps/perps
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24.22.0
          package-manager-cache: false
      - name: Install workspace package manager
        run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Test member
        run: pnpm --dir "${{ matrix.package }}" test
