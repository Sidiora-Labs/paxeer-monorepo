# Manual PR labels: app-hash-breaking, non-app-hash-breaking.
# Maintainers select the app-hash impact; release categories use area labels.
changelog:
  exclude:
    labels:
      - ignore-for-release
  categories:
    - title: Protocol runtime
      labels:
        - area:protocol
    - title: Agent
      labels:
        - area:agent
    - title: Platform
      labels:
        - area:platform
    - title: Programs
      labels:
        - area:programs
    - title: Human interface
      labels:
        - area:human
    - title: Contracts
      labels:
        - area:contracts
    - title: Wallet
      labels:
        - area:wallet
    - title: Paxeer Network
      labels:
        - area:paxeer
    - title: Specification
      labels:
        - area:spec
    - title: Documentation
      labels:
        - area:docs
    - title: Continuous integration
      labels:
        - area:ci
    - title: Other
      labels:
        - "*"
