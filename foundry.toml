# Root kernel-contract project; make test-contracts selects tests/solidity.
# See docs/MONOREPO.md#root-layout for the separate Paxeer chain project.
[profile.default]
src = "contracts"
test = "tests/solidity"
out = "build/forge-artifacts"
cache_path = "build/forge-cache"
solc_version = "0.8.27"
optimizer = true
optimizer_runs = 100000
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
extra_output = ["storageLayout"]
# contracts/src and contracts/test belong to the Paxeer chain Foundry project
# (foundry.paxeer.toml, libs under contracts/lib, npm deps under
# contracts/node_modules); keep them out of this one.
skip = ["contracts/src/**", "contracts/test/**", "contracts/lib/**", "contracts/node_modules/**", "contracts/bridge/**", "contracts/launchpad/**"]
fs_permissions = [
    { access = "read-write", path = "./tests/vectors/names" },
    { access = "read", path = "./build/forge-artifacts" },
    { access = "write", path = "./build" },
]

[profile.names]
src = "contracts/names"
test = "tests/solidity/names"
script = "contracts/names"
out = "build/forge-artifacts-names"
cache_path = "build/forge-cache-names"
fs_permissions = [
    { access = "read-write", path = "./tests/vectors/names" },
    { access = "write", path = "./build" },
]

[profile.governance]
src = "contracts/governance"
test = "tests/solidity/governance"
script = "contracts/governance"
out = "build/forge-artifacts-governance"
cache_path = "build/forge-cache-governance"
fs_permissions = [
    { access = "read-write", path = "./tests/vectors/names" },
    { access = "write", path = "./build" },
]

[fmt]
ignore = ["contracts/src/**/*.sol", "contracts/test/**/*.sol", "contracts/lib/**/*.sol", "contracts/node_modules/**/*.sol", "contracts/bridge/**", "contracts/launchpad/**/*.sol"]

[fuzz]
runs = 10000

[invariant]
runs = 1000
depth = 128
fail_on_revert = true
