global:
  scrape_interval:     15s
  evaluation_interval: 15s

rule_files:
  # - "first.rules"
  # - "second.rules"

scrape_configs:
  # This local deployment scrapes Prometheus itself and the explorer frontend.
  # The backend deployment owns localhost:4000/metrics in its prometheus.yml.
  # Benchmark, loadtest and hosted exporters are scraped by their own consumers.
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: frontend
    metrics_path: /explorer/node-api/metrics
    scheme: http
    static_configs:
      - targets: ['host.docker.internal:3000']
