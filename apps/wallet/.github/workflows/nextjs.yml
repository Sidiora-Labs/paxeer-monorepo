# Migration source: register as .github/workflows/wallet-nextjs.yml (domain 12).
name: Wallet standalone production image

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the production server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/wallet-pwa/Dockerfile
          target: runner
          push: false
          tags: wallet-pwa:${{ github.sha }}
          outputs: type=docker,dest=/tmp/wallet-image.tar
          build-args: |
            NEXT_PUBLIC_PAXEER_WALLET_API=${{ vars.NEXT_PUBLIC_PAXEER_WALLET_API }}
            NEXT_PUBLIC_PAXEER_RPC_URL=${{ vars.NEXT_PUBLIC_PAXEER_RPC_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_AUTH_REDIRECT_URL=${{ vars.NEXT_PUBLIC_AUTH_REDIRECT_URL }}
            NEXT_PUBLIC_PAXEER_HUMAN_API=${{ vars.NEXT_PUBLIC_PAXEER_HUMAN_API }}
            NEXT_PUBLIC_PAXEER_EXPLORER_URL=https://paxscan.io
            NEXT_PUBLIC_EXPLORER_BASE=https://paxscan.io
            NEXT_PUBLIC_EXPLORER_STATUS_URL=${{ vars.NEXT_PUBLIC_EXPLORER_STATUS_URL }}
            NEXT_PUBLIC_PAXEER_ATTESTOR_URL=${{ vars.NEXT_PUBLIC_PAXEER_ATTESTOR_URL }}
            NEXT_PUBLIC_PNS_API_BASE=/wallet/api/pns
            NEXT_PUBLIC_POINTS_API_BASE=${{ vars.NEXT_PUBLIC_POINTS_API_BASE }}
            NEXT_PUBLIC_MARKET_DATA_API=${{ vars.NEXT_PUBLIC_MARKET_DATA_API }}
            NEXT_PUBLIC_FX_RATES_API=${{ vars.NEXT_PUBLIC_FX_RATES_API }}
            NEXT_PUBLIC_PAXEER_GAS_SPONSOR=${{ vars.NEXT_PUBLIC_PAXEER_GAS_SPONSOR }}
            NEXT_PUBLIC_PAXEER_GAS_PAYMASTER=${{ vars.NEXT_PUBLIC_PAXEER_GAS_PAYMASTER }}
            NEXT_PUBLIC_PAXEER_USID_PER_PAX=${{ vars.NEXT_PUBLIC_PAXEER_USID_PER_PAX }}
            NEXT_PUBLIC_SID=${{ vars.NEXT_PUBLIC_SID }}
            NEXT_PUBLIC_CHAIN_ID=${{ vars.NEXT_PUBLIC_CHAIN_ID }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ vars.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_MEDIA_STORAGE_ORIGIN=${{ vars.NEXT_PUBLIC_MEDIA_STORAGE_ORIGIN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_USDC=${{ vars.NEXT_PUBLIC_USDC }}
            NEXT_PUBLIC_USDT=${{ vars.NEXT_PUBLIC_USDT }}
            NEXT_PUBLIC_USDL=${{ vars.NEXT_PUBLIC_USDL }}
            NEXT_PUBLIC_WPAX9=${{ vars.NEXT_PUBLIC_WPAX9 }}
            NEXT_PUBLIC_MTX=${{ vars.NEXT_PUBLIC_MTX }}
            NEXT_PUBLIC_PAXIE=${{ vars.NEXT_PUBLIC_PAXIE }}
            NEXT_PUBLIC_FLIP=${{ vars.NEXT_PUBLIC_FLIP }}
            NEXT_PUBLIC_MISFITZ=${{ vars.NEXT_PUBLIC_MISFITZ }}
            NEXT_PUBLIC_AGGIE=${{ vars.NEXT_PUBLIC_AGGIE }}
      - name: Hand off the exact image for publication
        uses: actions/upload-artifact@v4
        with:
          name: wallet-image-${{ github.sha }}
          path: /tmp/wallet-image.tar
          if-no-files-found: error
          retention-days: 1
