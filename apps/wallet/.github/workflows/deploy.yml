# Migration source: register as .github/workflows/wallet-deploy.yml (domain 12).
# Publishes the checked image and its immutable rollout reference; rollout is owned by domain 12.
name: Publish Wallet Production Image

on:
  push:
    branches: [main]
    paths:
      [
        'apps/wallet/**',
        'sdk/wallet/**',
        'services/agent/sdk/typescript/**',
        'services/wallet/**',
        'docker/wallet-pwa/**',
        '.github/workflows/wallet-*.yml',
      ]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  security-events: write
  packages: write

concurrency:
  group: wallet-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/wallet-ci.yml
  security:
    uses: ./.github/workflows/wallet-security.yml
  publish:
    name: Publish checked production image
    needs: [checks, security]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wallet-image-${{ github.sha }}
          path: /tmp/wallet-image
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked image and record its digest
        env:
          IMAGE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/wallet-pwa:${IMAGE_REVISION}"
          docker load --input /tmp/wallet-image/wallet-image.tar
          docker tag "wallet-pwa:${IMAGE_REVISION}" "$image"
          docker push "$image"
          docker image inspect "$image" --format '{{index .RepoDigests 0}}' > wallet-image-digest.txt
          test -s wallet-image-digest.txt
          grep -Ex 'ghcr.io/[^/]+/wallet-pwa@sha256:[0-9a-f]{64}' wallet-image-digest.txt
          cat wallet-image-digest.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-image-digest-${{ github.sha }}
          path: wallet-image-digest.txt
          if-no-files-found: error
