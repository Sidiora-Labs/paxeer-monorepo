# Migration source: register as .github/workflows/wallet-ci.yml (domain 12).
name: Wallet CI

on:
  push:
    branches: [main, develop]
    paths:
      [
        'apps/wallet/**',
        'sdk/wallet/**',
        'services/agent/sdk/typescript/**',
        'services/wallet/**',
        'docker/wallet-pwa/**',
        '.github/workflows/wallet-*.yml',
      ]
  pull_request:
    branches: [main, develop]
    paths:
      [
        'apps/wallet/**',
        'sdk/wallet/**',
        'services/agent/sdk/typescript/**',
        'services/wallet/**',
        'docker/wallet-pwa/**',
        '.github/workflows/wallet-*.yml',
      ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/wallet
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/wallet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: |
            apps/wallet/pnpm-lock.yaml
            services/wallet/pnpm-lock.yaml
      - name: Install SDK dependencies
        working-directory: services/wallet
        run: pnpm install --frozen-lockfile --filter ../../sdk/wallet...
      - name: Build SDK
        working-directory: services/wallet
        run: pnpm --filter ../../sdk/wallet... run build
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run ESLint
        run: pnpm run lint
      - name: Run TypeScript
        run: pnpm run type-check
      - name: Run tests
        run: pnpm test
      - name: Build
        run: pnpm run build

  image:
    needs: validate
    uses: ./.github/workflows/wallet-nextjs.yml
