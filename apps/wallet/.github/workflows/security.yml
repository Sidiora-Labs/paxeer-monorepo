# Migration source: register as .github/workflows/wallet-security.yml (domain 12).
name: Wallet Security

on:
  push:
    branches: [main, develop]
    paths:
      [
        'apps/wallet/**',
        'sdk/wallet/**',
        'services/agent/sdk/typescript/**',
        'services/wallet/**',
        '.github/workflows/wallet-*.yml',
      ]
  pull_request:
    branches: [main, develop]
    paths:
      [
        'apps/wallet/**',
        'sdk/wallet/**',
        'services/agent/sdk/typescript/**',
        'services/wallet/**',
        '.github/workflows/wallet-*.yml',
      ]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/wallet
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/wallet/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: apps/wallet/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: none
          config: |
            paths:
              - apps/wallet
              - sdk/wallet
              - services/agent/sdk/typescript
      - uses: github/codeql-action/analyze@v3

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
