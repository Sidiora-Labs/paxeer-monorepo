# Separate Paxeer chain project; select with FOUNDRY_CONFIG=foundry.paxeer.toml.
# See docs/MONOREPO.md#root-layout for the root kernel-contract project.
[profile.default]
src = "contracts/src"
out = "contracts/out"
test = "contracts/test"
libs = ["contracts/lib"]
remappings = [
    "forge-std/=contracts/lib/forge-std/src/",
    "@openzeppelin/contracts/=contracts/lib/openzeppelin-contracts/contracts/",
]
solc_version = "0.8.27"
auto_detect_solc = false

[profile.ci]
verbosity = 4

[fmt]
ignore = ["contracts/src/WPAX.sol"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
